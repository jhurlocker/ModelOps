apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upload-lm-eval-results
spec:
  description: Upload lm-eval results to s3 bucket
  params:
    - default: 'http://minio.modelops-storage.svc.cluster.local:9000'
      description: s3 API endpoint
      name: s3-api-endpoint
      type: string
    - description: >-
        Name of a Secret (in this Task's namespace) with
        accessKeyId/secretAccessKey keys, consumed via secretKeyRef.
        Never a credential value itself.
      name: s3-secret-name
      type: string
  steps:
    - name: upload-benchmark
      image: quay.io/jhurlocker/s3-upload:v0.1.0
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: S3_ENDPOINT_URL
          value: $(params.s3-api-endpoint)
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret-name)
              key: accessKeyId
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret-name)
              key: secretAccessKey
        - name: S3_BUCKET
          value: benchmark-results
        - name: TIMESTAMP
          value: $(cat lm-eval-timestamp.txt 2>/dev/null || echo "unknown")
        - name: PATTERN
          value: "*$(cat lm-eval-timestamp.txt 2>/dev/null)*"

  workspaces:
    - description: Shared workspace for storing benchmark results
      name: shared-workspace