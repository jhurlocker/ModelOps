# Optional Secret consumed by the gpu-advisor Task (spec.params.advisor-secret-name,
# default "gpu-advisor-credentials"). If this Secret does not exist, the task simply
# sends no Authorization header to the advisor-endpoint.
#
# Populate "api-key" with the bearer token expected by your external GPU Deployment
# Advisor agentic endpoint (e.g. a RunPod Serverless endpoint API key).
#
#   oc create secret generic gpu-advisor-credentials \
#     -n sandbox \
#     --from-literal=api-key='<your-runpod-or-agent-api-key>' \
#     --dry-run=client -o yaml | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: gpu-advisor-credentials
  namespace: sandbox
type: Opaque
stringData:
  api-key: "REPLACE_ME"
