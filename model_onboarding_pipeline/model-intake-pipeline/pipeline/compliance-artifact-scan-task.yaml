# FILE: compliance-artifact-scan-task.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: compliance-artifact-scan
spec:
  description: |
    FIRST gate in the onboarding pipeline. Simulates pulling a candidate LLM
    into a sandbox and running governance checks on it BEFORE it is ever
    deployed:

      1. compliance scan  - skopeo-inspects the model's OCI "modelcar" artifact
         (metadata only, no multi-GB layer pull) and evaluates a small set of
         organizational policy checks (supported architecture/OS, provenance/
         creation date, license + source labels).
      2. artifact security scan - runs a real Trivy vulnerability scan against
         the container image that will serve the model (the serving-runtime
         image by default) and gates on fixable HIGH/CRITICAL CVEs.

    Both reports are uploaded to S3, and the model is REGISTERED in the
    OpenShift AI Model Registry with the scan results attached as metadata.
    If either scan fails the model is STILL registered (marked FAILED, with
    links to the S3 reports) and only THEN is the task failed - so the
    pipeline halts before deploy, but there is a permanent, auditable record
    in the registry of why the model was rejected.
  params:
    - name: model-id
      type: string
      description: "Hugging Face model ID (used to resolve the modelcar OCI artifact for the compliance inspect)."
    - name: model-name
      type: string
      description: "Registered-model name; the identity this model keeps across the whole pipeline."
    - name: model-version
      type: string
      default: "v1"
      description: "Model Registry version name for this onboarding run."
    - name: modelcar-repo
      type: string
      default: "redhat-ai-services/modelcar-catalog"
      description: "Quay repo (org/name) holding the prebuilt modelcar OCI images."
    - name: modelcar-image
      type: string
      default: ""
      description: >-
        Optional explicit modelcar OCI image reference (e.g.
        'quay.io/redhat-ai-services/modelcar-catalog:llama-3.2-1b-instruct',
        with or without an 'oci://'/'docker://' scheme). When set, it is used
        verbatim and the model-id -> modelcar-repo:tag derivation is skipped.
    - name: artifact-scan-image
      type: string
      default: "registry.access.redhat.com/ubi9/python-311:latest"
      description: >-
        Container image scanned by Trivy for the artifact security scan. Defaults
        to a fast, publicly-pullable image for demos. For a real onboarding, set
        this to the serving-runtime image the model will actually run in
        (e.g. registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4) - note that image
        requires a registry pull secret on the node.
    - name: artifact-cve-threshold
      type: string
      default: "critical"
      description: >-
        Artifact-scan gate. 'critical' blocks only when fixable CRITICAL CVEs are
        found; 'high' blocks on fixable HIGH or CRITICAL; 'none' never blocks on
        CVEs (report only).
    - name: ignore-unfixed
      type: string
      default: "true"
      description: "When true, only vulnerabilities with an available fix are counted toward the gate."
    - name: allowed-architectures
      type: string
      default: "amd64,x86_64"
      description: "Comma-separated CPU architectures permitted by compliance policy."
    - name: mr-server
      type: string
      default: "http://modelops-registry.rhoai-model-registries.svc.cluster.local"
      description: "OpenShift AI Model Registry REST base URL (in-cluster service)."
    - name: mr-port
      type: string
      default: "8080"
      description: "Model Registry REST port."
    - name: model-reg-author
      type: string
      default: "ModelOps Platform Team"
      description: "Author recorded on the Model Registry entry."
    - name: s3-api-endpoint
      type: string
      default: "http://minio.modelops-storage.svc.cluster.local:9000"
    - name: s3-access-key-id
      type: string
      default: "minioadmin"
    - name: s3-secret-access-key
      type: string
      default: "minioadmin"
    - name: s3-bucket
      type: string
      default: "compliance-artifact-results"
      description: "S3 bucket for compliance + artifact scan reports (created if absent)."
    - name: s3-ui-route
      type: string
      default: ""
      description: >-
        Optional external S3 browser UI base URL. When set, registry links point
        at the UI; otherwise raw s3:// paths are recorded.
  results:
    - name: passed
      description: "true if BOTH compliance and artifact scans passed."
    - name: summary
      description: "One-line human-readable verdict."
  workspaces:
    - name: shared-workspace
      description: Shared workspace / sandbox for scan artifacts.
  steps:
    # ----------------------------------------------------------------------
    # STEP 1: compliance scan - skopeo-inspect the model's OCI artifact into
    # the sandbox (metadata only, fast). Resolve model-id -> modelcar tag the
    # same way deploy-model does, so we inspect the exact artifact that will
    # be deployed.
    # ----------------------------------------------------------------------
    - name: compliance-inspect
      image: quay.io/skopeo/stable:latest
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: MODEL_ID
          value: $(params.model-id)
        - name: MODELCAR_REPO
          value: $(params.modelcar-repo)
        - name: MODELCAR_IMAGE
          value: $(params.modelcar-image)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        SANDBOX="$(pwd)/compliance-artifact-sandbox"
        mkdir -p "$SANDBOX"
        chmod 777 "$(pwd)" 2>/dev/null || true
        chmod 777 "$SANDBOX" 2>/dev/null || true
        echo "--- Compliance scan: pulling model artifact metadata into sandbox ---"
        echo "Sandbox: $SANDBOX"

        REF=""
        if [ -n "${MODELCAR_IMAGE:-}" ]; then
          # Explicit override: use it verbatim (strip any scheme prefix).
          BARE="$(echo "$MODELCAR_IMAGE" | sed -E 's#^(oci|docker)://##')"
          CANDIDATE="docker://${BARE}"
          echo "  Using explicit modelcar-image override: $CANDIDATE"
          if skopeo inspect "$CANDIDATE" > "$SANDBOX/modelcar-inspect.json" 2>/tmp/skopeo.err; then
            REF="$BARE"
          fi
        else
          # Strip any URL scheme before deriving a tag -- MODEL_ID is
          # expected to be a bare Hugging Face org/name, but a URL can
          # end up here (e.g. pasted into the wizard's Model ID field
          # while Model Source was left at its Hugging Face default).
          # Without this, a value like
          # "https://quay.io/redhat-ai-services/modelcar-catalog:foo"
          # produces a still-scheme-prefixed, colon-containing tag that
          # gets appended after a second colon below, yielding a
          # malformed double-tagged reference. Mirrors the scheme-strip
          # already done for the explicit modelcar-image override above.
          MODEL_ID="$(echo "$MODEL_ID" | sed -E 's#^(https?|docker|oci)://##')"
          SHORT_TAG="$(echo "${MODEL_ID##*/}" | tr '[:upper:]' '[:lower:]')"
          ORG_TAG="$(echo "$MODEL_ID" | tr '[:upper:]' '[:lower:]' | sed 's#/#--#g')"

          for TAG in "$SHORT_TAG" "$ORG_TAG"; do
            CANDIDATE="docker://quay.io/${MODELCAR_REPO}:${TAG}"
            echo "  Trying modelcar artifact: $CANDIDATE"
            if skopeo inspect "$CANDIDATE" > "$SANDBOX/modelcar-inspect.json" 2>/tmp/skopeo.err; then
              REF="quay.io/${MODELCAR_REPO}:${TAG}"
              break
            fi
          done
        fi

        if [ -z "$REF" ]; then
          echo "WARN: could not inspect a modelcar artifact for '$MODEL_ID' (tried '$SHORT_TAG' and '$ORG_TAG')."
          cat /tmp/skopeo.err || true
          # Record the failure to inspect as an empty inspect; the evaluate step
          # will treat a missing/empty artifact as a compliance FAIL.
          echo "{}" > "$SANDBOX/modelcar-inspect.json"
          echo "" > "$SANDBOX/modelcar-ref.txt"
        else
          echo "  Resolved modelcar artifact: $REF"
          echo "oci://$REF" > "$SANDBOX/modelcar-ref.txt"
          echo "--- Artifact metadata (skopeo inspect) ---"
          head -c 600 "$SANDBOX/modelcar-inspect.json"; echo
        fi

    # ----------------------------------------------------------------------
    # STEP 2: artifact security scan - real Trivy CVE scan of the serving
    # image. Writes trivy-report.json into the sandbox for the evaluate step.
    # ----------------------------------------------------------------------
    - name: artifact-scan
      image: ghcr.io/aquasecurity/trivy:0.72.0
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: HOME
          value: /tmp
        - name: TRIVY_CACHE_DIR
          value: /tmp/trivycache
        - name: XDG_CACHE_HOME
          value: /tmp
        - name: SCAN_IMAGE
          value: $(params.artifact-scan-image)
        - name: IGNORE_UNFIXED
          value: $(params.ignore-unfixed)
      script: |
        #!/bin/sh
        set -eu
        SANDBOX="$(pwd)/compliance-artifact-sandbox"
        mkdir -p "$SANDBOX"
        chmod 777 "$SANDBOX" 2>/dev/null || true
        echo "--- Artifact security scan (Trivy) ---"
        echo "Scanning image: $SCAN_IMAGE"

        UNFIXED_FLAG=""
        if [ "$IGNORE_UNFIXED" = "true" ]; then
          UNFIXED_FLAG="--ignore-unfixed"
        fi

        # Non-fatal: a scan/pull error must not skip registration. Record an
        # empty report on failure; the evaluate step marks artifact-scan FAILED.
        if trivy image --quiet --scanners vuln \
             --severity LOW,MEDIUM,HIGH,CRITICAL $UNFIXED_FLAG \
             --format json -o "$SANDBOX/trivy-report.json" \
             "$SCAN_IMAGE"; then
          echo "Trivy scan complete."
        else
          echo "WARN: Trivy scan failed (image pull/auth/db error). Recording empty report."
          echo '{"Results":[],"_scan_error":true}' > "$SANDBOX/trivy-report.json"
        fi

    # ----------------------------------------------------------------------
    # STEP 3: evaluate policy, upload reports to S3.
    # Containerized compliance scanner - versioned, tested, auditable.
    # ----------------------------------------------------------------------
    - name: evaluate-and-upload
      image: quay.io/jhurlocker/compliance-scanner:v0.1.4
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: MODEL_ID
          value: $(params.model-id)
        - name: MODEL_NAME
          value: $(params.model-name)
        - name: MODEL_VERSION
          value: $(params.model-version)
        - name: ARTIFACT_SCAN_IMAGE
          value: $(params.artifact-scan-image)
        - name: CVE_THRESHOLD
          value: $(params.artifact-cve-threshold)
        - name: ALLOWED_ARCHES
          value: $(params.allowed-architectures)
        - name: S3_ENDPOINT_URL
          value: $(params.s3-api-endpoint)
        - name: S3_ACCESS_KEY_ID
          value: $(params.s3-access-key-id)
        - name: S3_SECRET_ACCESS_KEY
          value: $(params.s3-secret-access-key)
        - name: S3_BUCKET
          value: $(params.s3-bucket)
        - name: S3_UI_ROUTE
          value: $(params.s3-ui-route)
        - name: WORKSPACE_PATH
          value: $(workspaces.shared-workspace.path)
        - name: TIMESTAMP
          value: $(date +%Y%m%d_%H%M%S)
        - name: S3_PREFIX
          value: $(date +%Y%m%d_%H%M%S)_compliance_artifact
      args:
        - evaluate

    # --- Compose S3 links from evaluation output ---
    - name: compose-links
      image: registry.access.redhat.com/ubi9/python-311
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: WORKSPACE_PATH
          value: $(workspaces.shared-workspace.path)
        - name: S3_BUCKET
          value: $(params.s3-bucket)
        - name: S3_UI_ROUTE
          value: $(params.s3-ui-route)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        ws="$WORKSPACE_PATH"
        sandbox="$ws/compliance-artifact-sandbox"
        bucket="$S3_BUCKET"
        ui_route="${S3_UI_ROUTE%/}"
        timestamp="$(date +%Y%m%d_%H%M%S)"

        source /tmp/scan_env.sh 2>/dev/null || true
        CAR_REF="${MODELCAR_REF:-oci://quay.io/unknown}"
        PREFIX="${timestamp}_compliance_artifact"

        if [ -n "$ui_route" ]; then
          export COMPLIANCE_LINK="${ui_route}/download/${bucket}/${PREFIX}/compliance-artifact-summary.txt"
          export TRIVY_LINK="${ui_route}/download/${bucket}/${PREFIX}/trivy-report.json"
        else
          export COMPLIANCE_LINK="s3://${bucket}/${PREFIX}/compliance-artifact-summary.txt"
          export TRIVY_LINK="s3://${bucket}/${PREFIX}/trivy-report.json"
        fi

        if [ "${OVERALL_PASSED:-false}" = "true" ]; then
          OVERALL_STATUS="SCANNING (compliance+artifact PASSED, pending deploy)"
        else
          OVERALL_STATUS="FAILED - compliance/artifact scan"
        fi
        export OVERALL_STATUS

        echo "Composed links: COMPLIANCE=$COMPLIANCE_LINK TRIVY=$TRIVY_LINK"
        echo "$OVERALL_STATUS" > "$ws/compliance-artifact-summary.txt"
        echo "$COMPLIANCE_LINK" > "$ws/compliance-result-link.txt"
        echo "$TRIVY_LINK" > "$ws/trivy-result-link.txt"

    # --- Upload reports to S3 via containerized tool ---
    - name: s3-upload
      image: quay.io/jhurlocker/s3-upload:v0.1.1
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: S3_ENDPOINT_URL
          value: $(params.s3-api-endpoint)
        - name: S3_ACCESS_KEY_ID
          value: $(params.s3-access-key-id)
        - name: S3_SECRET_ACCESS_KEY
          value: $(params.s3-secret-access-key)
        - name: S3_BUCKET
          value: $(params.s3-bucket)
        - name: TIMESTAMP
          value: $(date +%Y%m%d_%H%M%S)
        - name: PREFIX_OVERRIDE
          value: $(date +%Y%m%d_%H%M%S)_compliance_artifact
        - name: PATTERN
          value: compliance-artifact-sandbox/*,compliance-artifact-summary.txt

    # --- Register model in Model Registry (best-effort, even on failure) ---
    - name: register-model
      image: quay.io/jhurlocker/compliance-scanner:v0.1.4
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: WORKSPACE_PATH
          value: $(workspaces.shared-workspace.path)
        - name: MODEL_NAME
          value: $(params.model-name)
        - name: MODEL_VERSION
          value: $(params.model-version)
        - name: MR_SERVER
          value: $(params.mr-server)
        - name: MR_PORT
          value: $(params.mr-port)
        - name: MR_AUTHOR
          value: $(params.model-reg-author)
        - name: MODEL_ID
          value: $(params.model-id)
        - name: ARTIFACT_SCAN_IMAGE
          value: $(params.artifact-scan-image)
        - name: MR_STAGE
          value: compliance-artifact-scan
      args:
        - register

    # --- Gate LAST, so the model is always registered first. ---
    - name: gate
      image: registry.access.redhat.com/ubi9/python-311
      workingDir: $(workspaces.shared-workspace.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        PASSED=$(cat compliance-artifact-passed.txt 2>/dev/null || echo "false")
        echo "--- Compliance/artifact gate: passed=$PASSED ---"
        if [ "$PASSED" != "true" ]; then
          echo "RESULT: BLOCKED - halting pipeline before deploy. Model registered as FAILED with report links."
          exit 1
        fi
        echo "RESULT: PASSED - model cleared to deploy for the live security (garak) scan."
