# FILE: build-modelcar-task.yaml
# Phase B (model-intake vertical slice): build a ModelCar OCI image from a
# Hugging Face model and push it to the in-cluster Zot registry, so the rest
# of the pipeline consumes a self-hosted artifact instead of a prebuilt
# catalog tag from quay.io.
#
# Two-stage build (per Red Hat's "Build and deploy a ModelCar container"
# article, developers.redhat.com): stage 1 downloads the model from Hugging
# Face into /models using huggingface_hub; stage 2 copies /models into a
# minimal ubi-micro image. ModelCar contract: model files must live in
# /models of the final image and nothing else is required.
#
# Security:
#   - The Hugging Face token (gated models only) is injected into the build
#     via `buildah --secret id=HF_TOKEN,env=HF_TOKEN`, which exposes the
#     step's HF_TOKEN env var to the build's RUN steps WITHOUT persisting it
#     in an image layer. HF_TOKEN itself is sourced via secretKeyRef
#     (optional: true) from the huggingface-secret-name Secret.
#   - Zot push credentials (username/password) are sourced via secretKeyRef
#     from the registry-auth-secret-name Secret, then passed to
#     `buildah login` from environment variables. The plaintext credential
#     is the SAME zotadmin identity whose bcrypt hash sits in Zot's
#     htpasswd file -- see gitops/components/runtime-config/secrets.yaml for
#     the rotation-coupling caveat (rotate both together or push auth
#     breaks silently).
#   - The push target is Zot's internal Service DNS (now HTTPS on :5000), and
#     the push verifies Zot's OpenShift service-serving cert (service CA).
#     Two references are emitted, splitting in-cluster vs node-level
#     consumers: `image-ref` (internal Service DNS, for in-cluster consumers
#     like compliance-artifact-scan) and `pull-ref` (Zot's Route hostname,
#     for deploy-model's node-level kubelet pull -- the node's OS resolver
#     cannot resolve .svc.cluster.local names at all). The Route hostname is
#     resolved at runtime (see the resolve-registry-host step); its TLS cert
#     is the router's public *.apps wildcard, trusted by the node by default.
#
# Builder execution: buildah runs rootless with the vfs storage driver,
# which avoids needing overlayfs or privileged access on OpenShift.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-modelcar
spec:
  description: |
    Builds a ModelCar OCI image from a Hugging Face model and pushes it to
    the in-cluster Zot registry. Emits the resulting full image reference
    as the "image-ref" result, consumed by downstream tasks (and Phase C).

    image-ref value shape: <registry-url>/<model-name>:<model-version>,
    e.g. zot.modelops-zot.svc.cluster.local:5000/granite-2b:v1 -- Zot's
    internal Service DNS, for in-cluster consumers. pull-ref is the same
    image via the node-resolvable Route hostname, consumed by deploy-model
    for the node-level (kubelet) pull.
  params:
    - name: model-id
      type: string
      description: "Hugging Face model ID (org/name) to download."
    - name: model-name
      type: string
      description: "OCI repository name in Zot (must be lower-case, DNS-label-safe)."
    - name: model-version
      type: string
      default: "v1"
      description: "OCI image tag in Zot."
    - name: huggingface-secret-name
      type: string
      default: "huggingface-credentials"
      description: >-
        Name of a Secret (in this Task's namespace) with a "token" key --
        consumed via secretKeyRef (optional: true). Never a token value.
    - name: registry-auth-secret-name
      type: string
      default: "zot-push-credentials"
      description: >-
        Name of a Secret (in this Task's namespace) with username/password
        keys for Zot push auth -- consumed via secretKeyRef. Never a
        credential value.
    - name: registry-url
      type: string
      default: "zot.modelops-zot.svc.cluster.local:5000"
      description: "Zot registry PUSH target host:port (internal Service DNS; HTTPS, verified against the installed service CA). The node-level PULL reference is derived separately from the Route hostname."
    - name: buildah-image
      type: string
      default: "quay.io/buildah/stable:v1.43.2"
      description: "Pinned buildah image used for the build and push."
  results:
    - name: image-ref
      description: "Full OCI reference of the ModelCar image on Zot's internal Service DNS: <registry-url>/<model-name>:<model-version>."
    - name: pull-ref
      description: "Full OCI reference of the ModelCar image via the Zot Route hostname (node-resolvable): <route-host>/<model-name>:<model-version>."
    - name: route-host
      description: "The Zot Route hostname, resolved at runtime from the modelops-zot Route."
  steps:
    - name: resolve-registry-host
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      env:
        - name: MODEL_NAME
          value: $(params.model-name)
        - name: MODEL_VERSION
          value: $(params.model-version)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # The Zot Route hostname is auto-generated at apply time (no spec.host
        # is committed), so resolve it from the live cluster. This is the ONLY
        # reference the node's kubelet/CRI-O can resolve when pulling the
        # ModelCar image -- the internal Service DNS does not resolve from the
        # node host (it uses the node's OS resolver, not CoreDNS).
        HOST="$(oc get route zot -n modelops-zot -o jsonpath='{.spec.host}')"
        if [ -z "${HOST}" ]; then
          echo "FATAL: could not resolve the Zot Route hostname (route 'zot' in namespace 'modelops-zot')" >&2
          exit 1
        fi

        # Emit BOTH the raw route host (traceability) and the full
        # node-resolvable pull reference from THIS step. The build-and-push
        # step cannot rely on $(steps.resolve-registry-host.results.route-host)
        # value interpolation (observed NOT substituted by Tekton v1 -- the env
        # arrives as the literal text -- while $(params.*) interpolation does
        # work), so pull-ref is composed here from params + the resolved host.
        printf '%s' "${HOST}" > "$(results.route-host.path)"
        printf '%s' "${HOST}/${MODEL_NAME}:${MODEL_VERSION}" > "$(results.pull-ref.path)"
        echo "Resolved Zot pull host: ${HOST}"
        echo "Node-pull reference: ${HOST}/${MODEL_NAME}:${MODEL_VERSION}"
    - name: build-and-push
      image: $(params.buildah-image)
      # SETFCAP is required for buildah to create its (rootless-style) user
      # namespace on OpenShift 4.11+/kernel 5.12+; without it, buildah's
      # reexec fails with "writing ... to /proc/<pid>/uid_map: operation not
      # permitted" (Red Hat KB solution #6993746). The pipelines-scc already
      # allows SETFCAP, so this is admitted, not dropped.
      securityContext:
        capabilities:
          add:
            - SETFCAP
      volumeMounts:
        # Defensive fallback trust source (see the service-CA install in the
        # script, which prefers the pod's own serviceaccount service-ca.crt).
        - name: zot-service-ca
          mountPath: /etc/zot-ca
          readOnly: true
      env:
        - name: MODEL_ID
          value: $(params.model-id)
        - name: MODEL_NAME
          value: $(params.model-name)
        - name: MODEL_VERSION
          value: $(params.model-version)
        - name: REGISTRY_URL
          value: $(params.registry-url)
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.huggingface-secret-name)
              key: token
              optional: true
        - name: REGISTRY_USER
          valueFrom:
            secretKeyRef:
              name: $(params.registry-auth-secret-name)
              key: username
        - name: REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.registry-auth-secret-name)
              key: password
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Trust the OpenShift service-serving CA so buildah verifies Zot's
        # serving cert (service.beta.openshift.io/serving-cert-secret-name)
        # over HTTPS, instead of disabling TLS verification.
        # Primary source: the CA bundle the Service CA operator injects into
        # every pod's serviceaccount dir. Fallback: the zot-service-ca
        # inject-cabundle ConfigMap (the EvalHub CA-fix pattern) mounted at
        # /etc/zot-ca, for clusters where that path isn't populated.
        if [ -f /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt ]; then
          cp /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt /etc/pki/ca-trust/source/anchors/zot-service-ca.crt
        elif [ -f /etc/zot-ca/service-ca.crt ]; then
          cp /etc/zot-ca/service-ca.crt /etc/pki/ca-trust/source/anchors/zot-service-ca.crt
        else
          echo "FATAL: no OpenShift service-serving CA bundle available" >&2
          exit 1
        fi
        update-ca-trust

        # Normalise the registry host:port (strip any scheme) and derive the
        # full destination reference. MODEL_NAME must already be lower-case.
        REGISTRY_HOST="$(printf '%s' "${REGISTRY_URL}" | sed -E 's#^(https?|docker|oci)://##')"
        REF="${REGISTRY_HOST}/${MODEL_NAME}:${MODEL_VERSION}"

        echo "=== build-modelcar: ${MODEL_ID} -> ${REF} ==="

        # Rootless buildah with the vfs storage driver. Keep all state under
        # a scratch dir so we never depend on a writable $HOME or a specific
        # storage.conf in the pinned builder image.
        export HOME=/tmp
        WORK="$(mktemp -d)"
        STORAGE_ROOT="${WORK}/storage"

        # --- Two-stage ModelCar Containerfile (see file header) ---
        cat > "${WORK}/Containerfile" <<'EOF'
        FROM registry.access.redhat.com/ubi9/python-311:latest AS base
        USER root
        RUN pip install --no-cache-dir "huggingface_hub"
        COPY download_model.py /download_model.py
        ARG MODEL_ID
        ENV MODEL_ID="${MODEL_ID}"
        RUN python /download_model.py

        FROM registry.access.redhat.com/ubi9/ubi-micro:9.4
        COPY --from=base /models /models
        USER 1001
        EOF

        # --- Hugging Face download script (runs in stage 1) ---
        cat > "${WORK}/download_model.py" <<'EOF'
        import os
        import sys

        from huggingface_hub import snapshot_download

        model_id = os.environ.get("MODEL_ID", "").strip()
        token = os.environ.get("HF_TOKEN", "").strip() or None

        if not model_id:
            print("FATAL: MODEL_ID is empty", file=sys.stderr)
            sys.exit(1)

        snapshot_download(
            repo_id=model_id,
            token=token,
            local_dir="/models",
            allow_patterns=["*.safetensors", "*.bin", "*.json", "*.txt", "*.md", "*.model", "*.py"],
        )
        print("Downloaded model files to /models")
        EOF

        # Authenticate to Zot over HTTPS (verified against the mounted
        # service CA above).
        buildah --root "${STORAGE_ROOT}" --storage-driver vfs \
          login \
          --username "${REGISTRY_USER}" --password "${REGISTRY_PASSWORD}" \
          "${REGISTRY_HOST}"

        # Build. HF_TOKEN is injected into the build via --secret (env mode),
        # so it reaches the download step but is never persisted in a layer.
        pushd "${WORK}" >/dev/null
        buildah --root "${STORAGE_ROOT}" --storage-driver vfs \
          bud --format oci \
          --build-arg MODEL_ID="${MODEL_ID}" \
          --secret id=HF_TOKEN,env=HF_TOKEN \
          -t "${REGISTRY_HOST}/${MODEL_NAME}:${MODEL_VERSION}" \
          -f Containerfile .
        popd >/dev/null

        # Push to Zot over HTTPS. The SOURCE is the locally-built, already-tagged
        # image (no transport prefix); the DESTINATION carries the docker://
        # transport. Verified against the mounted service CA above.
        buildah --root "${STORAGE_ROOT}" --storage-driver vfs \
          push \
          "${REGISTRY_HOST}/${MODEL_NAME}:${MODEL_VERSION}" \
          "docker://${REGISTRY_HOST}/${MODEL_NAME}:${MODEL_VERSION}"

        # Emit the in-cluster reference for downstream tasks / Phase C.
        # (pull-ref is emitted by the resolve-registry-host step, where the
        # route hostname is resolved -- see that step's note about Tekton not
        # interpolating $(steps.X.results.Y) values; build-and-push keeps no
        # ROUTE_HOST env for the same reason.)
        #   image-ref = Zot's internal Service DNS (in-cluster consumers,
        #               e.g. compliance-artifact-scan's skopeo inspect)
        printf '%s' "${REGISTRY_HOST}/${MODEL_NAME}:${MODEL_VERSION}" > "$(results.image-ref.path)"
        echo "Built and pushed: ${REGISTRY_HOST}/${MODEL_NAME}:${MODEL_VERSION}"
  volumes:
    # Mounted into the build-and-push step as the fallback service-CA source.
    # optional: the primary source is the pod's own serviceaccount CA bundle,
    # so this ConfigMap being absent must not block the Task from running.
    - name: zot-service-ca
      configMap:
        name: zot-service-ca
        optional: true
