apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gpu-advisor
  namespace: vllm
spec:
  description: |
    Gate 1 - Runs FIRST in the pipeline, before any deployment or security
    scanning. Inspects local GPU inventory and model requirements, then
    generates a deployment plan.

    Two modes:
      - remote (advisor-endpoint set): the task gathers cluster GPU
        inventory locally (it has the only in-cluster credentials), then
        POSTs that inventory + model params to an external endpoint that
        runs the "OpenShift vLLM GPU Deployment Advisor" agentic skill
        (e.g. a RunPod-hosted agent). The endpoint's JSON response is used
        as the plan.
      - local (advisor-endpoint empty): falls back to the built-in
        heuristic sizing script (no external call).

    Does NOT deploy. If the plan is BLOCKED (insufficient GPU capacity),
    the task FAILS so the pipeline halts before wasting time on a
    deployment/approval that cannot succeed. Otherwise the task succeeds
    with plan-status=PLAN_READY and the pipeline moves to the
    wait-for-approval gate.
  params:
    - name: model-id
      type: string
      description: "Hugging Face model ID"
    - name: plan-id
      type: string
      default: "$(context.taskRun.name)"
      description: >-
        Unique id correlating this plan with the wait-for-approval gate.
        When run from the Pipeline, this should be set to
        $(context.pipelineRun.name) (Task-level context vars like
        $(context.pipelineRun.name) do NOT resolve inside a Task's own
        steps, only inside Pipeline-level fields, so the Pipeline must
        pass it in explicitly as a param).
    - name: target-namespace
      type: string
      default: "vllm"
    - name: environment
      type: string
      default: ""
      description: >-
        Optional label for the target environment/cluster this plan is for
        (e.g. "sandbox" or "staging"). Shown in the plan output so a run that
        assesses two separate clusters is easy to follow. Purely cosmetic.
    - name: context-length
      type: string
      default: "32768"
    - name: concurrency
      type: string
      default: "4"
    - name: allow-time-slicing
      type: string
      default: "false"
    - name: allow-mig
      type: string
      default: "false"
    - name: gpu-operator-namespace
      type: string
      default: "nvidia-gpu-operator"
      description: "Namespace of the NVIDIA GPU Operator (where the time-slicing ConfigMap is created)."
    - name: clusterpolicy-name
      type: string
      default: "gpu-cluster-policy"
      description: "Name of the NVIDIA ClusterPolicy CR to patch when enabling time-slicing."
    - name: time-slicing-configmap
      type: string
      default: "modelops-time-slicing"
      description: "Name of the time-slicing device-plugin ConfigMap the advisor generates."
    - name: max-time-slices
      type: string
      default: "8"
      description: "Upper bound on time-slicing replicas the advisor will recommend for one physical GPU."
    - name: gpu-isolation-policy
      type: string
      default: "dedicated"
    - name: advisor-endpoint
      type: string
      default: ""
      description: >-
        Optional URL of an external GPU Deployment Advisor agentic
        endpoint (e.g. a RunPod endpoint running the
        openshift-vllm-gpu-advisor-skill). When empty, the task falls
        back to the built-in local heuristic sizing script.
    - name: advisor-secret-name
      type: string
      default: "gpu-advisor-credentials"
      description: >-
        Name of an (optional) Secret in this namespace with an "api-key"
        key used to authenticate to advisor-endpoint as a Bearer token.
        If the Secret does not exist, no Authorization header is sent.
    - name: advisor-timeout-seconds
      type: string
      default: "300"
      description: >-
        HTTP timeout in seconds when calling advisor-endpoint. Reasoning
        models can consume a growing token budget (retried up to
        24576 tokens if the model exhausts its budget on hidden
        chain-of-thought without answering), so this needs enough headroom
        for a large completion, not just a normal chat response.
  results:
    - name: plan-status
      description: "PLAN_READY (plan generated for review) or BLOCKED."
    - name: plan-id
      description: "Unique id for this plan, used to correlate the approval gate."
    - name: gpu-inventory
      description: "JSON: cluster GPU inventory"
    - name: deployment-options
      description: "JSON: ranked deployment options"
    - name: recommendation
      description: "Summary of recommended plan"
  steps:
    - name: discover-gpu-inventory
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.shared-workspace.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- Step 1: Discover cluster GPU inventory (local, in-cluster creds required) ---"
        oc whoami || true
        oc cluster-info || true
        echo ""

        echo "Discovering GPU nodes..."
        oc get nodes -o json > gpu_nodes.json 2>/dev/null || echo '{"items": []}' > gpu_nodes.json
        echo "Checking NVIDIA operator..."
        oc get csv -A 2>/dev/null | grep -i nvidia || echo "No NVIDIA CSVs found"
        echo "Discovering GPU allocations..."
        oc get pods -A -o json > all_pods.json 2>/dev/null || echo '{"items": []}' > all_pods.json
        echo "Inventory captured: gpu_nodes.json, all_pods.json"

    - name: run-advisor
      image: registry.access.redhat.com/ubi9/python-311
      env:
        - name: MODEL_ID
          value: $(params.model-id)
        - name: TARGET_NS
          value: $(params.target-namespace)
        - name: ENVIRONMENT
          value: $(params.environment)
        - name: CTX_LEN
          value: $(params.context-length)
        - name: CONCURRENCY
          value: $(params.concurrency)
        - name: ALLOW_TS
          value: $(params.allow-time-slicing)
        - name: ALLOW_MIG
          value: $(params.allow-mig)
        - name: ISOLATION
          value: $(params.gpu-isolation-policy)
        - name: GPU_OPERATOR_NS
          value: $(params.gpu-operator-namespace)
        - name: CLUSTERPOLICY_NAME
          value: $(params.clusterpolicy-name)
        - name: TIME_SLICING_CM
          value: $(params.time-slicing-configmap)
        - name: MAX_TIME_SLICES
          value: $(params.max-time-slices)
        - name: ADVISOR_ENDPOINT
          value: $(params.advisor-endpoint)
        - name: ADVISOR_TIMEOUT
          value: $(params.advisor-timeout-seconds)
        - name: PLAN_ID
          value: $(params.plan-id)
        - name: ADVISOR_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.advisor-secret-name)
              key: api-key
              optional: true
        - name: REQUESTS_CA_BUNDLE
          value: /etc/ssl/certs/ca-bundle.crt
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-bundle.crt
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- OpenShift vLLM GPU Deployment Advisor ---"
        [ -n "${ENVIRONMENT:-}" ] && echo "Target environment/cluster: $ENVIRONMENT"
        echo "Model: $MODEL_ID"
        echo "Target namespace: $TARGET_NS"
        echo "Plan id: $PLAN_ID"
        if [ -n "$ADVISOR_ENDPOINT" ]; then
          echo "Mode: REMOTE (agentic skill endpoint: $ADVISOR_ENDPOINT)"
        else
          echo "Mode: LOCAL (built-in heuristic sizing script)"
        fi
        echo ""

        pip install -q requests transformers 2>&1 | grep -v "already satisfied" || true

        cat > /tmp/gpu_advisor.py << 'PYEOF'
        import json
        import os
        import math
        import sys

        MODEL_ID = os.environ["MODEL_ID"]
        TARGET_NS = os.environ["TARGET_NS"]
        CTX_LEN = int(os.environ["CTX_LEN"])
        CONCURRENCY = int(os.environ["CONCURRENCY"])
        ALLOW_TS = os.environ["ALLOW_TS"].lower() == "true"
        ALLOW_MIG = os.environ["ALLOW_MIG"].lower() == "true"
        ISOLATION = os.environ["ISOLATION"]
        ADVISOR_ENDPOINT = os.environ.get("ADVISOR_ENDPOINT", "").strip()
        ADVISOR_TIMEOUT = int(os.environ.get("ADVISOR_TIMEOUT", "180"))
        ADVISOR_API_KEY = os.environ.get("ADVISOR_API_KEY", "")
        PLAN_ID = os.environ.get("PLAN_ID", "unknown")

        nodes_json = json.load(open("gpu_nodes.json"))
        pods_json = json.load(open("all_pods.json"))

        gpu_mem = {
            "H100": 80, "A100": 80, "A10": 24, "A10G": 24, "L4": 23, "L40": 48,
            "L40S": 48, "RTX6000": 48, "T4": 16, "V100": 32
        }

        def _gpu_util_from_args(args):
            # Pull --gpu-memory-utilization out of a container's argv (vLLM),
            # whether written as "--gpu-memory-utilization=0.9" or as two
            # separate tokens "--gpu-memory-utilization" "0.9".
            if not args:
                return None
            for i, a in enumerate(args):
                if a.startswith("--gpu-memory-utilization"):
                    if "=" in a:
                        try:
                            return float(a.split("=", 1)[1])
                        except ValueError:
                            return None
                    if i + 1 < len(args):
                        try:
                            return float(args[i + 1])
                        except ValueError:
                            return None
            return None

        def _product_family(product):
            # Strip NVIDIA's "-SHARED" suffix (added when time-slicing is on)
            # and vendor prefix so it matches the gpu_mem lookup table.
            p = product.replace("NVIDIA-", "").replace("NVIDIA ", "")
            p = p.replace("-SHARED", "").replace("_SHARED", "")
            return p.split("-")[0].strip()

        node_gpus = {}
        occupants = []          # existing GPU-consuming pods (the "already deployed" models)
        total_alloc = total_used = total_free = 0
        for node in nodes_json.get("items", []):
            name = node["metadata"]["name"]
            labels = node["metadata"].get("labels", {})
            allocs = node["status"].get("allocatable", {})
            gpu_count = int(allocs.get("nvidia.com/gpu", 0))
            if gpu_count == 0:
                continue
            product = labels.get("nvidia.com/gpu.product", "unknown")
            family = _product_family(product)
            # Per-GPU physical memory: prefer the node's own label (MiB) over
            # the static table, so we use the REAL card size (e.g. L4 ~23 GB).
            mem_mib = labels.get("nvidia.com/gpu.memory")
            if mem_mib:
                try:
                    phys_mem = int(mem_mib) / 1024.0
                except ValueError:
                    phys_mem = gpu_mem.get(family, 40)
            else:
                phys_mem = gpu_mem.get(family, 40)
            usable_mem = phys_mem * 0.9
            # Time-slicing replicas already advertised for this GPU (1 = none).
            try:
                replicas = int(labels.get("nvidia.com/gpu.replicas", "1"))
            except ValueError:
                replicas = 1
            time_sliced = replicas > 1 or product.endswith("SHARED")
            physical_gpus = max(1, gpu_count // replicas) if replicas else gpu_count
            schedulable = not any(t.get("effect") == "NoSchedule" for t in node["spec"].get("taints", []))
            alloc = 0
            node_occupants = []
            for pod in pods_json.get("items", []):
                if pod["spec"].get("nodeName") != name:
                    continue
                pod_gpu = 0
                pod_util = None
                for c in pod["spec"].get("containers", []):
                    pod_gpu += int(c["resources"].get("requests", {}).get("nvidia.com/gpu", 0))
                    u = _gpu_util_from_args(c.get("args"))
                    if u is not None:
                        pod_util = u
                alloc += pod_gpu
                if pod_gpu > 0:
                    pmeta = pod["metadata"]
                    plabels = pmeta.get("labels", {})
                    isvc = plabels.get("serving.kserve.io/inferenceService") \
                        or plabels.get("serving.kserve.io/inferenceservice")
                    occ = {
                        "namespace": pmeta.get("namespace"),
                        "pod": pmeta.get("name"),
                        "inferenceservice": isvc,
                        "gpu_requested": pod_gpu,
                        "gpu_memory_utilization": pod_util,
                        "node": name,
                    }
                    node_occupants.append(occ)
                    occupants.append(occ)
            free = gpu_count - alloc
            node_gpus[name] = {
                "product": product, "family": family,
                "allocatable": gpu_count, "allocated": alloc, "free": free,
                "physical_gpus": physical_gpus, "replicas_per_gpu": replicas,
                "time_sliced": time_sliced,
                "physical_memory_gb": round(phys_mem, 1),
                "memory_gb": round(usable_mem, 1),
                "schedulable": schedulable,
                "occupants": node_occupants,
            }
            total_alloc += gpu_count
            total_used += alloc
            total_free += free
            print("    {}: {}/{} {} free ({:.1f} GB usable/GPU, replicas/GPU={}, {} occupant(s))".format(
                name, free, gpu_count, product, usable_mem, replicas, len(node_occupants)))

        largest_free = max((n["free"] for n in node_gpus.values()), default=0)
        min_mem = min((n["memory_gb"] for n in node_gpus.values()), default=0)
        print("  Total: {}/{} free, largest single node: {}, existing GPU occupants: {}".format(
            total_free, total_alloc, largest_free, len(occupants)))

        gpu_inventory = {
            "total": total_alloc, "allocated": total_used, "free": total_free,
            "largest_single_node": largest_free, "nodes": node_gpus,
            "occupants": occupants,
        }

        def local_recommendation():
            param_map = {
                "70b": 70e9, "33b": 33e9, "32b": 32e9, "13b": 13e9,
                "8b": 8e9, "7b": 7e9, "6.9b": 6.9e9, "3b": 3e9, "2b": 2e9, "1b": 1e9
            }
            model_lower = MODEL_ID.lower()
            param_count = 7e9
            for k, v in param_map.items():
                if k in model_lower:
                    param_count = v
                    break

            try:
                from transformers import AutoConfig
                cfg = AutoConfig.from_pretrained(MODEL_ID, use_fast=True, trust_remote_code=False)
                num_layers = getattr(cfg, "num_hidden_layers", 32)
                hidden_size = getattr(cfg, "hidden_size", 4096)
                num_heads = getattr(cfg, "num_attention_heads", 32)
                num_kv_heads = getattr(cfg, "num_key_value_heads", num_heads)
                head_dim = hidden_size // num_heads
                print("  Loaded config: {} hidden, {} layers, {} heads, {} KV heads".format(
                    hidden_size, num_layers, num_heads, num_kv_heads))
            except Exception as e:
                print("  Could not load config ({}). Using defaults.".format(e))
                num_layers, hidden_size, num_heads, num_kv_heads = 32, 4096, 32, 32
                head_dim = 128

            weight_gb = (param_count * 2) / 1e9
            kv_bytes_per_tok = 2 * num_layers * num_kv_heads * head_dim * 2
            kv_gb = (kv_bytes_per_tok * CTX_LEN * CONCURRENCY) / 1e9
            overhead_gb = weight_gb * 0.15
            total_gb = weight_gb + kv_gb + overhead_gb

            print("  Param estimate: {:.1f}B, Weight (BF16): {:.2f} GB, KV cache: {:.2f} GB".format(
                param_count / 1e9, weight_gb, kv_gb))
            print("  Overhead: {:.2f} GB, Total per replica: {:.2f} GB".format(overhead_gb, total_gb))

            options = []
            if total_gb <= min_mem and node_gpus:
                options.append({
                    "name": "Single GPU", "status": "recommended",
                    "gpu_per_replica": 1, "replicas": 1, "total_gpus": 1,
                    "topology": {"tp": 1, "pp": 1, "dp": 1},
                    "pros": ["Simplest, lowest latency, easy ops"],
                    "cons": ["Limited throughput, single point of failure"],
                    "vllm_flags": ["--max-model-len={}".format(CTX_LEN),
                                   "--max-num-seqs={}".format(CONCURRENCY * 2),
                                   "--enable-prefix-caching"]
                })

            if not options:
                tp = math.ceil(total_gb / min_mem) if min_mem > 0 else 0
                if tp <= largest_free and tp >= 2:
                    options.append({
                        "name": "Tensor Parallel (TP={})".format(tp), "status": "recommended",
                        "gpu_per_replica": tp, "replicas": 1, "total_gpus": tp,
                        "topology": {"tp": tp, "pp": 1, "dp": 1},
                        "pros": ["Distributes across {} GPUs".format(tp)],
                        "cons": ["Requires GPUs on same node"],
                        "vllm_flags": ["--tensor-parallel-size={}".format(tp),
                                       "--max-model-len={}".format(CTX_LEN),
                                       "--max-num-seqs={}".format(CONCURRENCY * 2),
                                       "--enable-prefix-caching"]
                    })
                elif ALLOW_TS:
                    options.append({
                        "name": "Time Slicing (Shared GPU)", "status": "not_recommended",
                        "gpu_per_replica": 1, "time_slices": 2, "replicas": 1, "total_gpus": 1,
                        "topology": {"tp": 1, "pp": 1, "dp": 1, "sharing": "time_slicing"},
                        "pros": ["Works with limited/no dedicated GPUs"],
                        "cons": ["Higher latency, noisy neighbor, NOT for production SLO"],
                        "vllm_flags": ["--max-model-len={}".format(CTX_LEN),
                                       "--max-num-seqs={}".format(CONCURRENCY),
                                       "--enable-prefix-caching"]
                    })
                else:
                    options.append({
                        "name": "BLOCKED - Insufficient GPU Capacity", "status": "blocked",
                        "gpu_per_replica": 0, "replicas": 0, "total_gpus": 0,
                        "topology": {},
                        "pros": [],
                        "cons": ["Need {:.1f} GB, only {:.1f} GB/GPU, {} free GPUs".format(total_gb, min_mem, total_free)],
                        "vllm_flags": []
                    })

            return {
                "model_id": MODEL_ID,
                "param_count": param_count,
                "estimated_total_memory_gb": total_gb,
                "options": options,
                "sources": ["local heuristic sizing (no web research performed)"]
            }

        # System prompt condensing the openshift-vllm-gpu-advisor-skill's
        # decision framework for a raw vLLM/LLM chat-completions endpoint
        # (ADVISOR_ENDPOINT is a plain OpenAI-compatible inference server,
        # NOT a bespoke agent API - so we prompt it directly instead of
        # POSTing a custom JSON payload to a nonexistent route).
        ADVISOR_SYSTEM_PROMPT = """\
        You are an expert OpenShift + vLLM GPU deployment advisor performing \
        capacity planning for a model-onboarding pipeline. You will be given a \
        model id, target sizing parameters, and a JSON snapshot of the OpenShift \
        cluster's current GPU inventory. Decide whether the model can be deployed \
        and, if so, the best topology.

        Sizing heuristic:
        1. Estimate parameter count from the model id (look for size hints like \
        7b/8b/13b/70b in the name) if you don't know the exact figure.
        2. weight_memory_gb ~= param_count * 2 bytes / 1e9 (assume bf16/fp16).
        3. kv_cache_gb ~= 2 * num_layers * num_kv_heads * head_dim * 2 bytes \
        * expected_context_length * expected_concurrency / 1e9 (estimate \
        num_layers/num_kv_heads/head_dim from known architecture if possible, \
        otherwise use reasonable defaults for the model's parameter scale).
        4. total_gb ~= weight_memory_gb + kv_cache_gb + 15% overhead.
        5. Each cluster node's "memory_gb" field is the already-usable (post \
        0.85-utilization-headroom) memory per GPU on that node. Compare total_gb \
        against a single GPU's memory_gb, then against multiple GPUs on the same \
        node (tensor parallel) using free GPU count per node.
        6. Preference order: Single GPU > Tensor Parallel (same node, GPUs with \
        fast interconnect) > Time Slicing (ONLY if allow_time_slicing is true) > \
        BLOCKED (no feasible option).
        7. If gpu_isolation_policy is "dedicated", do NOT recommend time-slicing \
        or MIG as the top choice unless allow_time_slicing/allow_mig is true AND \
        no dedicated option fits at all.
        8. If nothing fits, return a single option with status "blocked" and a \
        clear reason in "cons".

        Respond with STRICT JSON ONLY. No prose, no markdown, no code fences. \
        Match this exact schema:
        {
          "options": [
            {
              "name": "string (e.g. 'Single GPU', 'Tensor Parallel (TP=2)', 'Time Slicing (Shared GPU)', 'BLOCKED - Insufficient GPU Capacity')",
              "status": "recommended | feasible | not_recommended | blocked",
              "gpu_per_replica": 0,
              "replicas": 1,
              "total_gpus": 0,
              "topology": {"tp": 1, "pp": 1, "dp": 1},
              "pros": ["string"],
              "cons": ["string"],
              "vllm_flags": ["--max-model-len=32768", "--max-num-seqs=8", "--enable-prefix-caching"]
            }
          ],
          "param_count": 0,
          "estimated_total_memory_gb": 0.0
        }
        Order the "options" array best option first. Every entry in "vllm_flags" \
        must be a single self-contained token in "--flag=value" or "--flag" form \
        (no spaces within a token, since each string becomes one container argv \
        element - never split a flag and its value into separate tokens or use a \
        space-separated single string)."""

        # Marker exception so the retry loop can tell "model exhausted its
        # token budget on hidden reasoning before emitting any content"
        # apart from other failures, and react by growing max_tokens
        # instead of just blindly retrying with the same budget.
        class BudgetExhaustedError(ValueError):
            pass

        def _call_advisor_once(requests, headers, advisor_model_id, chat_payload, attempt, max_tokens):
            chat_payload = dict(chat_payload, max_tokens=max_tokens)
            print("  POST {}/chat/completions (model={}, timeout={}s, attempt={}, max_tokens={})".format(
                ADVISOR_ENDPOINT.rstrip("/"), advisor_model_id, ADVISOR_TIMEOUT, attempt, max_tokens))
            resp = requests.post(
                "{}/chat/completions".format(ADVISOR_ENDPOINT.rstrip("/")),
                json=chat_payload, headers=headers, timeout=ADVISOR_TIMEOUT,
            )
            resp.raise_for_status()
            choice = resp.json()["choices"][0]
            message = choice["message"]
            content = (message.get("content") or "").strip()
            if not content:
                finish_reason = choice.get("finish_reason")
                if finish_reason == "length":
                    raise BudgetExhaustedError(
                        "Advisor LLM returned empty content (finish_reason=length); "
                        "it used its whole {}-token budget on hidden reasoning "
                        "before emitting any answer.".format(max_tokens)
                    )
                raise ValueError(
                    "Advisor LLM returned empty content (finish_reason={})".format(finish_reason)
                )

            # Strip markdown code fences if the model added them anyway.
            if content.startswith("```"):
                content = content.split("```", 2)[1]
                if content.startswith("json"):
                    content = content[4:]
                content = content.strip()

            try:
                data = json.loads(content)
            except json.JSONDecodeError as e:
                # Transient truncation (e.g. a proxy/tunnel cutting the
                # response body mid-stream under concurrent load) shows up
                # here as malformed/incomplete JSON even though the HTTP
                # call itself succeeded. Log the raw content so it's
                # possible to diagnose, then let the caller retry.
                print("  Raw content that failed to parse ({} chars): {!r}".format(
                    len(content), content), file=sys.stderr)
                raise ValueError("Advisor LLM response was not valid JSON: {}".format(e))

            options = data.get("options") or []
            if not options:
                raise ValueError("Advisor LLM returned no 'options'")

            return {
                "model_id": MODEL_ID,
                "param_count": data.get("param_count", 0) or 0,
                "estimated_total_memory_gb": data.get("estimated_total_memory_gb", 0) or 0,
                "options": options,
                "sources": ["remote agentic LLM ({}) via {}".format(
                    advisor_model_id, ADVISOR_ENDPOINT)],
                "raw_response": data,
            }

        def _discover_advisor_model(requests, headers):
            # ADVISOR_ENDPOINT is a raw OpenAI-compatible vLLM server (not a
            # custom agent API), so discover which model it's actually
            # serving via GET /models rather than assuming.
            #
            # This has been observed to time out (read timeout after 30s)
            # with no prior chat activity, which strongly suggests
            # ADVISOR_ENDPOINT is backed by a serverless/scale-to-zero
            # deployment (e.g. RunPod serverless) that needs to spin up a
            # fresh worker and load the model into GPU memory before it can
            # answer *any* request, including this cheap metadata one. So
            # this needs its own generous-timeout retry loop with backoff
            # rather than assuming the endpoint is instantly reachable.
            attempts = 4
            backoff = 15
            last_err = None
            import time
            for attempt in range(1, attempts + 1):
                try:
                    print("  GET {}/models (attempt {}/{}, timeout={}s)".format(
                        ADVISOR_ENDPOINT.rstrip("/"), attempt, attempts, ADVISOR_TIMEOUT))
                    models_resp = requests.get(
                        "{}/models".format(ADVISOR_ENDPOINT.rstrip("/")),
                        headers=headers, timeout=ADVISOR_TIMEOUT,
                    )
                    models_resp.raise_for_status()
                    served = models_resp.json().get("data", [])
                    if not served:
                        raise ValueError("Advisor endpoint /models returned no served models")
                    return served[0]["id"]
                except (ValueError, requests.exceptions.RequestException) as e:
                    last_err = e
                    print("  Attempt {}/{} failed: {} (endpoint may be cold-starting)".format(
                        attempt, attempts, e), file=sys.stderr)
                    if attempt < attempts:
                        print("  Retrying in {}s...".format(backoff), file=sys.stderr)
                        time.sleep(backoff)
            raise last_err

        def remote_recommendation():
            import requests

            headers = {"Content-Type": "application/json"}
            if ADVISOR_API_KEY:
                headers["Authorization"] = "Bearer {}".format(ADVISOR_API_KEY)

            advisor_model_id = _discover_advisor_model(requests, headers)
            print("  Advisor endpoint is serving: {}".format(advisor_model_id))

            user_payload = {
                "plan_id": PLAN_ID,
                "model_id": MODEL_ID,
                "target_namespace": TARGET_NS,
                "expected_context_length": CTX_LEN,
                "expected_concurrency": CONCURRENCY,
                "gpu_isolation_policy": ISOLATION,
                "allow_time_slicing": ALLOW_TS,
                "allow_mig": ALLOW_MIG,
                "gpu_inventory": gpu_inventory,
            }
            chat_payload = {
                "model": advisor_model_id,
                "temperature": 0,
                "messages": [
                    {"role": "system", "content": ADVISOR_SYSTEM_PROMPT},
                    {"role": "user", "content": json.dumps(user_payload, indent=2)},
                ],
            }

            # Observed in practice: this reasoning-capable model's hidden
            # chain-of-thought length varies noticeably run-to-run (even at
            # temperature=0, likely due to real concurrent load on the
            # shared endpoint affecting batching/sampling), sometimes
            # consuming an entire generous-looking token budget before ever
            # emitting the answer, and truncated/malformed JSON or
            # connection errors (e.g. a serverless endpoint cold-starting)
            # also show up as transient failures unrelated to the prompt
            # itself. Retry with a growing max_tokens budget on
            # budget-exhaustion, and a short backoff on network errors,
            # before giving up and falling back to the local heuristic.
            attempts = 3
            max_tokens = 6144
            last_err = None
            import time
            for attempt in range(1, attempts + 1):
                try:
                    return _call_advisor_once(requests, headers, advisor_model_id, chat_payload, attempt, max_tokens)
                except BudgetExhaustedError as e:
                    last_err = e
                    print("  Attempt {}/{} failed: {}".format(attempt, attempts, e), file=sys.stderr)
                    max_tokens = min(max_tokens * 2, 24576)
                    if attempt < attempts:
                        print("  Retrying with max_tokens={}...".format(max_tokens), file=sys.stderr)
                except (ValueError, requests.exceptions.RequestException) as e:
                    last_err = e
                    print("  Attempt {}/{} failed: {}".format(attempt, attempts, e), file=sys.stderr)
                    if attempt < attempts:
                        print("  Retrying in 5s...".format(), file=sys.stderr)
                        time.sleep(5)
            raise last_err

        if ADVISOR_ENDPOINT:
            try:
                result = remote_recommendation()
            except Exception as e:
                print("ERROR calling advisor endpoint: {}".format(e), file=sys.stderr)
                print("Falling back to local heuristic sizing.", file=sys.stderr)
                result = local_recommendation()
        else:
            result = local_recommendation()

        options = result["options"]
        param_count = result.get("param_count", 0) or 0
        total_gb = result.get("estimated_total_memory_gb", 0) or 0

        # ------------------------------------------------------------------
        # GPU-SHARING PLANNER
        # The base recommendation above only reasons about whether the model
        # *fits in memory* - it does not account for the GPU already being
        # occupied. Here we make the advisor "smart": if there is no free
        # whole GPU (or the GPU is already time-sliced) but the new model can
        # share the card with what's already there, recommend TIME-SLICING,
        # compute a fair per-model --gpu-memory-utilization split, list the
        # co-resident models that must be redeployed at the lower split, and
        # GENERATE the exact YAML (time-slicing ConfigMap + ClusterPolicy
        # patch) that the apply-gpu-sharing task will apply.
        # ------------------------------------------------------------------
        MAX_TIME_SLICES = int(os.environ.get("MAX_TIME_SLICES", "8"))
        GPU_OPERATOR_NS = os.environ.get("GPU_OPERATOR_NS", "nvidia-gpu-operator")
        CLUSTERPOLICY_NAME = os.environ.get("CLUSTERPOLICY_NAME", "gpu-cluster-policy")
        TIME_SLICING_CM = os.environ.get("TIME_SLICING_CM", "modelops-time-slicing")

        def plan_gpu_sharing():
            plan = {
                "enabled": False,
                "reconfigure_time_slicing": False,
                "reason": "",
                "node": None,
                "gpu_product": None,
                "physical_memory_gb": None,
                "replicas": 1,
                "target_gpu_memory_utilization": None,
                "coresident_models": [],
                "configmap_name": TIME_SLICING_CM,
                "configmap_namespace": GPU_OPERATOR_NS,
                "clusterpolicy_name": CLUSTERPOLICY_NAME,
            }
            if not node_gpus:
                plan["reason"] = "no GPU nodes discovered"
                return plan

            # Pick the target node: prefer one that already has occupants
            # (the "existing model" we must co-reside with); else the one with
            # the least free capacity.
            occ_nodes = [(n, d) for n, d in node_gpus.items() if d["occupants"]]
            if occ_nodes:
                node_name, node = occ_nodes[0]
            else:
                node_name, node = min(node_gpus.items(), key=lambda kv: kv[1]["free"])

            phys_mem = node["physical_memory_gb"]
            existing = node["occupants"]
            n_existing = len(existing)

            has_free_dedicated = (total_free > 0) and (not node["time_sliced"])
            if has_free_dedicated:
                plan["reason"] = ("a free dedicated GPU is available ({} free); "
                                  "no sharing required".format(total_free))
                return plan

            if not ALLOW_TS:
                plan["reason"] = ("GPU is fully allocated and allow-time-slicing "
                                  "is false; cannot fit the new model")
                return plan
            if ISOLATION == "dedicated" and not ALLOW_TS:
                plan["reason"] = "isolation policy is 'dedicated'; sharing disallowed"
                return plan

            models_to_coreside = n_existing + 1
            replicas = max(models_to_coreside, node["replicas_per_gpu"])
            replicas = min(replicas, MAX_TIME_SLICES)
            target_util = round(0.9 / models_to_coreside, 2)
            share_gb = target_util * phys_mem
            # Feasibility for time-slicing is bounded by the model WEIGHTS (+a
            # little overhead), NOT weights+full-KV: --gpu-memory-utilization
            # caps vLLM's allocation and the KV cache is elastic (it simply
            # shrinks to whatever fits in the share). So compare the weight
            # footprint against the per-model share.
            weight_gb = (param_count * 2) / 1e9 if param_count else (total_gb or 0.0)
            min_footprint = weight_gb * 1.2  # weights + ~20% runtime/overhead
            new_need = total_gb or 0.0

            if min_footprint > share_gb + 0.01:
                plan["reason"] = (
                    "even time-slicing {}-way gives only {:.1f} GB/model, but the "
                    "new model's weights need ~{:.1f} GB - does not fit".format(
                        models_to_coreside, share_gb, min_footprint))
                plan["enabled"] = False
                plan["does_not_fit"] = True
                return plan

            # Feasible via time-slicing.
            plan["enabled"] = True
            plan["node"] = node_name
            plan["gpu_product"] = node["product"]
            plan["physical_memory_gb"] = phys_mem
            plan["replicas"] = replicas
            plan["target_gpu_memory_utilization"] = target_util
            # We only need to (re)configure time-slicing if the GPU isn't
            # already advertising at least `replicas` slices.
            plan["reconfigure_time_slicing"] = node["replicas_per_gpu"] < replicas
            plan["reason"] = (
                "GPU {} on {} is fully allocated with {} existing model(s); "
                "time-slice {}-way and cap each model at "
                "--gpu-memory-utilization={} (~{:.1f} GB each of {:.1f} GB)".format(
                    node["product"], node_name, n_existing, replicas,
                    target_util, share_gb, phys_mem))

            # Co-resident models that need to be redeployed at the lower split.
            for occ in existing:
                cur = occ.get("gpu_memory_utilization")
                needs = (cur is None) or (cur > target_util + 0.01)
                plan["coresident_models"].append({
                    "namespace": occ["namespace"],
                    "inferenceservice": occ["inferenceservice"],
                    "pod": occ["pod"],
                    "current_gpu_memory_utilization": cur,
                    "target_gpu_memory_utilization": target_util,
                    "needs_redeploy": bool(needs),
                })

            # Prepend a time-slicing option as the recommendation, carrying the
            # per-model memory cap so deploy-model applies it to the new model.
            ts_flags = [
                "--gpu-memory-utilization={}".format(target_util),
                "--max-model-len={}".format(CTX_LEN),
                "--max-num-seqs={}".format(CONCURRENCY),
                "--enable-prefix-caching",
            ]
            ts_option = {
                "name": "Time Slicing (Shared GPU, {}-way)".format(replicas),
                "status": "recommended",
                "gpu_per_replica": 1, "replicas": 1, "total_gpus": 1,
                "time_slices": replicas,
                "topology": {"tp": 1, "pp": 1, "dp": 1, "sharing": "time_slicing"},
                "pros": [
                    "Fits the new model onto an already-occupied {} alongside "
                    "{} existing model(s)".format(node["product"], n_existing),
                    "No extra hardware; both models share the card",
                ],
                "cons": [
                    "Shared compute/memory (noisy neighbor); not for strict "
                    "latency SLOs",
                    "Co-resident model(s) redeployed at "
                    "--gpu-memory-utilization={}".format(target_util),
                ],
                "vllm_flags": ts_flags,
                "gpu_sharing": plan,
            }
            options.insert(0, ts_option)
            return plan

        gpu_sharing_plan = plan_gpu_sharing()

        # Generate the concrete YAML/patch artifacts when a reconfigure is needed.
        def _write_time_slicing_artifacts(plan):
            replicas = plan["replicas"]
            cm_yaml = (
                "apiVersion: v1\n"
                "kind: ConfigMap\n"
                "metadata:\n"
                "  name: {cm}\n"
                "  namespace: {ns}\n"
                "data:\n"
                "  any: |-\n"
                "    version: v1\n"
                "    flags:\n"
                "      migStrategy: none\n"
                "    sharing:\n"
                "      timeSlicing:\n"
                "        resources:\n"
                "          - name: nvidia.com/gpu\n"
                "            replicas: {replicas}\n"
            ).format(cm=plan["configmap_name"], ns=plan["configmap_namespace"], replicas=replicas)
            with open("time-slicing-config.yaml", "w") as f:
                f.write(cm_yaml)

            # Strategic-merge patch for the ClusterPolicy: point the device
            # plugin at our ConfigMap and default all GPU nodes to the "any" key.
            patch = {"spec": {"devicePlugin": {"config": {
                "name": plan["configmap_name"], "default": "any"}}}}
            with open("clusterpolicy-patch.json", "w") as f:
                json.dump(patch, f, indent=2)
            return cm_yaml

        ts_yaml_preview = ""
        if gpu_sharing_plan.get("enabled") and gpu_sharing_plan.get("reconfigure_time_slicing"):
            ts_yaml_preview = _write_time_slicing_artifacts(gpu_sharing_plan)

        with open("gpu-sharing-plan.json", "w") as f:
            json.dump(gpu_sharing_plan, f, indent=2)

        # If sharing was required but the model does not even fit time-sliced,
        # force a BLOCKED recommendation.
        if gpu_sharing_plan.get("does_not_fit"):
            options = [{
                "name": "BLOCKED - Does Not Fit Even Time-Sliced", "status": "blocked",
                "gpu_per_replica": 0, "replicas": 0, "total_gpus": 0, "topology": {},
                "pros": [], "cons": [gpu_sharing_plan.get("reason", "insufficient capacity")],
                "vllm_flags": [],
            }]

        summary = [
            "# vLLM Deployment Recommendation", "",
            "## Summary",
            "**Plan id**: {}".format(PLAN_ID),
            "**Target environment**: {}".format(os.environ.get("ENVIRONMENT") or TARGET_NS),
            "**Model**: {}".format(MODEL_ID),
            "**Source**: {}".format(", ".join(result.get("sources", []))),
        ]
        if param_count:
            summary.append("**Estimated parameters**: {:.1f}B".format(param_count / 1e9))
        if total_gb:
            summary.append("**Estimated memory**: {:.2f} GB".format(total_gb))
        summary.extend([
            "**Cluster**: {} total GPUs, {} free, largest single node: {}".format(
                total_alloc, total_free, largest_free),
            "", "## Recommendation"
        ])

        blocked = (not options) or (options[0].get("status") == "blocked")

        if not blocked:
            rec = options[0]
            summary.extend([
                "**Recommended topology**: {}".format(rec["name"]),
                "**GPUs per replica**: {}".format(rec["gpu_per_replica"]),
                "**Total GPUs needed**: {}".format(rec["total_gpus"]),
                "**Status**: {}".format(rec["status"].upper()),
                "", "### Recommended vLLM command:",
                "```bash",
                "vllm serve {} {}".format(MODEL_ID, " ".join(rec["vllm_flags"])),
                "```", "", "### Ranked Options:"
            ])
            for i, o in enumerate(options, 1):
                marker = ">>>" if o is rec else "   "
                summary.append("  {} {}. {} [{}]: {} GPU/replica, {} replica, {} total".format(
                    marker, i, o["name"], o["status"].upper(),
                    o["gpu_per_replica"], o["replicas"], o["total_gpus"]))
            if gpu_sharing_plan.get("enabled"):
                p = gpu_sharing_plan
                summary.extend([
                    "", "## GPU SHARING (TIME-SLICING) REQUIRED", "",
                    p["reason"], "",
                    "**Target GPU node**: {}".format(p["node"]),
                    "**Time-slice replicas/GPU**: {}".format(p["replicas"]),
                    "**Per-model --gpu-memory-utilization**: {}".format(
                        p["target_gpu_memory_utilization"]),
                    "**Reconfigure device plugin**: {}".format(
                        "yes" if p["reconfigure_time_slicing"] else "no (already time-sliced)"),
                    "",
                    "### Co-resident models to redeploy at the lower memory split:",
                ])
                if p["coresident_models"]:
                    for cm in p["coresident_models"]:
                        summary.append(
                            "  - {}/{} (isvc={}): {} -> {}{}".format(
                                cm["namespace"], cm["pod"], cm["inferenceservice"],
                                cm["current_gpu_memory_utilization"],
                                cm["target_gpu_memory_utilization"],
                                "" if cm["needs_redeploy"] else " (already OK)"))
                else:
                    summary.append("  (none)")
                if ts_yaml_preview:
                    summary.extend([
                        "", "### Time-slicing ConfigMap to apply "
                        "(apply-gpu-sharing task applies this automatically):",
                        "```yaml", ts_yaml_preview.rstrip(), "```",
                        "", "### ClusterPolicy [{}] patch:".format(p["clusterpolicy_name"]),
                        "```json",
                        json.dumps({"spec": {"devicePlugin": {"config": {
                            "name": p["configmap_name"], "default": "any"}}}}, indent=2),
                        "```",
                    ])
            summary.extend([
                "", "## DEPLOYMENT PLAN - MANUAL APPROVAL REQUIRED", "",
                "**PLAN_READY** - Deployment plan generated. The pipeline will now PAUSE",
                "at the wait-for-approval gate. It will NOT deploy until a human",
                "approves this plan in the model intake UI.", "",
            ])
        else:
            summary.extend([
                "", "**NO FEASIBLE OPTIONS**. The model cannot be deployed with current GPU capacity.", "",
                "Suggestions:", "- Add GPUs to cluster", "- Use quantization (INT8/INT4)",
                "- Reduce context length or concurrency", "",
                "**BLOCKED** - halting pipeline before approval/deploy stages."
            ])

        with open("gpu-inventory.json", "w") as f:
            json.dump(gpu_inventory, f, indent=2)

        with open("deployment-options.json", "w") as f:
            json.dump({
                "plan_id": PLAN_ID,
                "recommended": options[0]["name"] if options else "none",
                "options": options
            }, f, indent=2)

        with open("gpu-advisor-summary.txt", "w") as f:
            f.write("\n".join(summary))

        with open("plan-id.txt", "w") as f:
            f.write(PLAN_ID)

        if not blocked:
            with open("recommended-vllm-command.sh", "w") as f:
                f.write("#!/usr/bin/env bash\nvllm serve {} {}\n".format(
                    MODEL_ID, " ".join(options[0]["vllm_flags"])))
            with open("plan-status.txt", "w") as f:
                f.write("PLAN_READY")
        else:
            with open("recommended-vllm-command.sh", "w") as f:
                f.write("# No feasible options\n")
            with open("plan-status.txt", "w") as f:
                f.write("BLOCKED")

        print("\n--- GPU Advisor Summary ---")
        print("\n".join(summary))

        if blocked:
            print("\n# BLOCKED - no feasible deployment option. Halting pipeline.")
            sys.exit(1)

        print("\n# PLAN_READY - Plan generated for manual review. Agent will NOT auto-deploy.")
        PYEOF
        python3 /tmp/gpu_advisor.py

      workingDir: $(workspaces.shared-workspace.path)

    - name: emit-results
      image: registry.access.redhat.com/ubi9/python-311
      workingDir: $(workspaces.shared-workspace.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # Tekton results share a ~4KB termination-message budget, so emit only
        # COMPACT values here. The full artifacts (gpu-inventory.json,
        # deployment-options.json, gpu-advisor-summary.txt, gpu-sharing-plan.json,
        # time-slicing-config.yaml, clusterpolicy-patch.json) remain on the
        # shared workspace for downstream tasks and human review.
        cp plan-status.txt "$(results.plan-status.path)"
        cp plan-id.txt "$(results.plan-id.path)"
        python3 - <<'PYEOF'
        import json
        inv = json.load(open("gpu-inventory.json"))
        with open("$(results.gpu-inventory.path)", "w") as f:
            json.dump({"total": inv.get("total"), "allocated": inv.get("allocated"),
                       "free": inv.get("free"),
                       "occupants": len(inv.get("occupants", []))}, f)
        opts = json.load(open("deployment-options.json"))
        top = (opts.get("options") or [{}])[0]
        with open("$(results.deployment-options.path)", "w") as f:
            json.dump({"recommended": opts.get("recommended"),
                       "status": top.get("status"),
                       "time_slices": top.get("time_slices")}, f)
        # Short recommendation = the "Recommended topology" line if present.
        rec = "see gpu-advisor-summary.txt on workspace"
        for line in open("gpu-advisor-summary.txt"):
            if "Recommended topology" in line or "NO FEASIBLE" in line:
                rec = line.strip()
                break
        with open("$(results.recommendation.path)", "w") as f:
            f.write(rec[:512])
        PYEOF
  workspaces:
    - name: shared-workspace
      description: Workspace for advisor artifacts
