apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gpu-advisor
spec:
  description: |
    Gate 1 - Runs FIRST in the pipeline, before any deployment or security
    scanning. Inspects local GPU inventory and model requirements, then
    generates a deployment plan.

    Two modes:
      - remote (advisor-endpoint set): the task gathers cluster GPU
        inventory locally (it has the only in-cluster credentials), then
        POSTs that inventory + model params to an external endpoint that
        runs the "OpenShift vLLM GPU Deployment Advisor" agentic skill
        (e.g. a RunPod-hosted agent). The endpoint's JSON response is used
        as the plan.
      - local (advisor-endpoint empty): falls back to the built-in
        heuristic sizing script (no external call).

    Does NOT deploy. If the plan is BLOCKED (insufficient GPU capacity),
    the task FAILS so the pipeline halts before wasting time on a
    deployment/approval that cannot succeed. Otherwise the task succeeds
    with plan-status=PLAN_READY and the pipeline moves to the
    wait-for-approval gate.
  params:
    - name: model-id
      type: string
      description: "Hugging Face model ID"
    - name: model-tokenizer
      type: string
      default: ""
      description: >-
        Optional Hugging Face id to use for architecture-config lookup
        (num layers/hidden size/heads, used for KV-cache sizing), when
        model-id itself is not a resolvable Hugging Face id -- e.g. an
        OCI/modelcar tag such as "granite-3.3-2b-instruct" (missing its
        org prefix, since the modelcar catalog's naming convention
        drops it). When empty, falls back to model-id, matching prior
        behavior. When the effective id (this or model-id) can't be
        resolved either, the advisor falls back to a generic 7B-class
        architecture shape for KV-cache sizing and explicitly flags the
        resulting estimate as a low-confidence assumption rather than
        silently presenting it as precise.
    - name: plan-id
      type: string
      default: "$(context.taskRun.name)"
      description: >-
        Unique id correlating this plan with the wait-for-approval gate.
        When run from the Pipeline, this should be set to
        $(context.pipelineRun.name) (Task-level context vars like
        $(context.pipelineRun.name) do NOT resolve inside a Task's own
        steps, only inside Pipeline-level fields, so the Pipeline must
        pass it in explicitly as a param).
    - name: target-namespace
      type: string
      default: "vllm"
    - name: environment
      type: string
      default: ""
      description: >-
        Optional label for the target environment/cluster this plan is for
        (e.g. "sandbox" or "staging"). Shown in the plan output so a run that
        assesses two separate clusters is easy to follow. Purely cosmetic.
    - name: context-length
      type: string
      default: "32768"
    - name: concurrency
      type: string
      default: "4"
    - name: allow-time-slicing
      type: string
      default: "false"
    - name: allow-mig
      type: string
      default: "false"
    - name: gpu-operator-namespace
      type: string
      default: "nvidia-gpu-operator"
      description: "Namespace of the NVIDIA GPU Operator (where the time-slicing ConfigMap is created)."
    - name: clusterpolicy-name
      type: string
      default: "gpu-cluster-policy"
      description: "Name of the NVIDIA ClusterPolicy CR to patch when enabling time-slicing."
    - name: time-slicing-configmap
      type: string
      default: "modelops-time-slicing"
      description: "Name of the time-slicing device-plugin ConfigMap the advisor generates."
    - name: max-time-slices
      type: string
      default: "8"
      description: "Upper bound on time-slicing replicas the advisor will recommend for one physical GPU."
    - name: gpu-isolation-policy
      type: string
      default: "dedicated"
    - name: advisor-endpoint
      type: string
      default: ""
      description: >-
        Optional URL of an external GPU Deployment Advisor agentic
        endpoint (e.g. a RunPod endpoint running the
        openshift-vllm-gpu-advisor-skill). When empty, the task falls
        back to the built-in local heuristic sizing script.
    - name: advisor-secret-name
      type: string
      default: "gpu-advisor-credentials"
      description: >-
        Name of an (optional) Secret in this namespace with an "api-key"
        key used to authenticate to advisor-endpoint as a Bearer token.
        If the Secret does not exist, no Authorization header is sent.
    - name: advisor-timeout-seconds
      type: string
      default: "300"
      description: >-
        HTTP timeout in seconds when calling advisor-endpoint. Reasoning
        models can consume a growing token budget (retried up to
        24576 tokens if the model exhausts its budget on hidden
        chain-of-thought without answering), so this needs enough headroom
        for a large completion, not just a normal chat response.
  results:
    - name: plan-status
      description: "PLAN_READY (plan generated for review) or BLOCKED."
    - name: plan-id
      description: "Unique id for this plan, used to correlate the approval gate."
    - name: gpu-inventory
      description: "JSON: cluster GPU inventory"
    - name: deployment-options
      description: "JSON: ranked deployment options"
    - name: recommendation
      description: "Summary of recommended plan"
  steps:
    - name: discover-gpu-inventory
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.shared-workspace.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- Step 1: Discover cluster GPU inventory (local, in-cluster creds required) ---"
        oc whoami 2>/dev/null || true
        oc cluster-info 2>/dev/null || true
        echo ""

        echo "Discovering GPU nodes..."
        oc get nodes -o json > gpu_nodes.json 2>/dev/null || echo '{"items": []}' > gpu_nodes.json
        echo "Checking NVIDIA operator..."
        oc get csv -A 2>/dev/null | grep -i nvidia || echo "No NVIDIA CSVs found"
        echo "Discovering GPU allocations..."
        oc get pods -A -o json > all_pods.json 2>/dev/null || echo '{"items": []}' > all_pods.json
        echo "Inventory captured: gpu_nodes.json, all_pods.json"

    - name: run-advisor
      image: quay.io/jhurlocker/gpu-advisor:v0.1.4
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: MODEL_ID
          value: $(params.model-id)
        - name: MODEL_TOKENIZER
          value: $(params.model-tokenizer)
        - name: TARGET_NS
          value: $(params.target-namespace)
        - name: ENVIRONMENT
          value: $(params.environment)
        - name: CTX_LEN
          value: $(params.context-length)
        - name: CONCURRENCY
          value: $(params.concurrency)
        - name: ALLOW_TS
          value: $(params.allow-time-slicing)
        - name: ALLOW_MIG
          value: $(params.allow-mig)
        - name: ISOLATION
          value: $(params.gpu-isolation-policy)
        - name: GPU_OPERATOR_NS
          value: $(params.gpu-operator-namespace)
        - name: CLUSTERPOLICY_NAME
          value: $(params.clusterpolicy-name)
        - name: TIME_SLICING_CM
          value: $(params.time-slicing-configmap)
        - name: MAX_TIME_SLICES
          value: $(params.max-time-slices)
        - name: ADVISOR_ENDPOINT
          value: $(params.advisor-endpoint)
        - name: ADVISOR_TIMEOUT
          value: $(params.advisor-timeout-seconds)
        - name: PLAN_ID
          value: $(params.plan-id)
        - name: ADVISOR_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.advisor-secret-name)
              key: api-key
              optional: true
        - name: REQUESTS_CA_BUNDLE
          value: /etc/ssl/certs/ca-bundle.crt
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-bundle.crt

    - name: emit-results
      image: registry.access.redhat.com/ubi9/python-311
      workingDir: $(workspaces.shared-workspace.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # Tekton results share a ~4KB termination-message budget, so emit only
        # COMPACT values here. The full artifacts (gpu-inventory.json,
        # deployment-options.json, gpu-advisor-summary.txt, gpu-sharing-plan.json,
        # time-slicing-config.yaml, clusterpolicy-patch.json) remain on the
        # shared workspace for downstream tasks and human review.
        cp plan-status.txt "$(results.plan-status.path)"
        cp plan-id.txt "$(results.plan-id.path)"
        python3 - <<'PYEOF'
        import json
        inv = json.load(open("gpu-inventory.json"))
        with open("$(results.gpu-inventory.path)", "w") as f:
            json.dump({"total": inv.get("total"), "allocated": inv.get("allocated"),
                       "free": inv.get("free"),
                       "occupants": len(inv.get("occupants", []))}, f)
        opts = json.load(open("deployment-options.json"))
        top = (opts.get("options") or [{}])[0]
        with open("$(results.deployment-options.path)", "w") as f:
            json.dump({"recommended": opts.get("recommended"),
                       "status": top.get("status"),
                       "time_slices": top.get("time_slices")}, f)
        # Short recommendation = the "Recommended topology" line if present.
        rec = "see gpu-advisor-summary.txt on workspace"
        for line in open("gpu-advisor-summary.txt"):
            if "Recommended topology" in line or "NO FEASIBLE" in line:
                rec = line.strip()
                break
        with open("$(results.recommendation.path)", "w") as f:
            f.write(rec[:512])
        PYEOF
  workspaces:
    - name: shared-workspace
      description: Workspace for advisor artifacts
