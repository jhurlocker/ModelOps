# FILE: deploy-model-task.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-model
spec:
  description: |
    Deploys a model via one of two paths, controlled by deploy-maas:

    deploy-maas=false (default / sandbox pipeline):
      Helm-based vLLM KServe deployment. Model weights sourced from the
      community "modelcar" OCI catalog. GPU sizing from gpu-advisor's
      deployment-options.json. Creates a ServingRuntime + InferenceService.

    deploy-maas=true (promotion pipeline, user opted in):
      Distributed inference via LLMInferenceService + MaaS CRDs
      (MaaSModelRef, MaaSAuthPolicy, MaaSSubscriptions). Registers the
      model in MaaS for API-key-based access.
  params:
    - name: releaseName
      type: string
      description: "The name for the Helm release / deployment."
      default: "granite-2b"
    - name: namespace
      type: string
      default: vllm
    - name: chartUrl
      type: string
      default: "https://redhat-ai-services.github.io/helm-charts/"
    - name: chartVersion
      type: string
      default: "0.7.1"
    - name: model-id
      type: string
      description: "Hugging Face model ID to deploy."
    - name: modelcar-image
      type: string
      default: ""
      description: "Optional explicit modelcar OCI image reference."
    - name: huggingface-token
      type: string
      default: ""
    - name: valuesContent
      type: string
      default: ""
      description: "Optional full Helm values YAML override."
    - name: gpu-count-override
      type: string
      default: ""
      description: "Optional manual GPU count override for Helm path."
    - name: hardwareProfileName
      type: string
      default: "gpu-profile"
    - name: hardwareProfileNamespace
      type: string
      default: "redhat-ods-applications"
    - name: servingRuntimeName
      type: string
      default: ""
    - name: servingRuntimeImage
      type: string
      default: "registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4"
    - name: deploy-maas
      type: string
      default: "false"
      description: "Set to 'true' to deploy via LLMInferenceService + MaaS CRDs instead of Helm vLLM."
    - name: maas-serving-ns
      type: string
      default: "llm"
    - name: maas-policy-ns
      type: string
      default: "models-as-a-service"
    - name: maas-gpu-count
      type: string
      default: "1"
    - name: maas-runtime-image
      type: string
      default: "registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.3.0"
    - name: maas-gpu-mem-util
      type: string
      default: "0.90"
    - name: maas-authorized-group
      type: string
      default: "system:authenticated"
  workspaces:
    - description: Shared workspace for storing benchmark/advisor results
      name: shared-workspace
  steps:
    - name: deploy
      image: quay.io/jhurlocker/deploy-model-task:v0.1.1
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: RELEASE_NAME
          value: $(params.releaseName)
        - name: NAMESPACE
          value: $(params.namespace)
        - name: MODEL_ID
          value: $(params.model-id)
        - name: MODELCAR_IMAGE
          value: $(params.modelcar-image)
        - name: HF_TOKEN
          value: $(params.huggingface-token)
        - name: VALUES_CONTENT
          value: $(params.valuesContent)
        - name: GPU_COUNT_OVERRIDE
          value: $(params.gpu-count-override)
        - name: HW_PROFILE_NAME
          value: $(params.hardwareProfileName)
        - name: HW_PROFILE_NAMESPACE
          value: $(params.hardwareProfileNamespace)
        - name: CHART_URL
          value: $(params.chartUrl)
        - name: CHART_VERSION
          value: $(params.chartVersion)
        - name: SERVING_RUNTIME_NAME
          value: $(params.servingRuntimeName)
        - name: SERVING_RUNTIME_IMAGE
          value: $(params.servingRuntimeImage)
        - name: DEPLOY_MAAS
          value: $(params.deploy-maas)
        - name: MAAS_SERVING_NS
          value: $(params.maas-serving-ns)
        - name: MAAS_POLICY_NS
          value: $(params.maas-policy-ns)
        - name: MAAS_GPU_COUNT
          value: $(params.maas-gpu-count)
        - name: MAAS_RUNTIME_IMAGE
          value: $(params.maas-runtime-image)
        - name: MAAS_GPU_MEM_UTIL
          value: $(params.maas-gpu-mem-util)
        - name: MAAS_AUTHORIZED_GROUP
          value: $(params.maas-authorized-group)
