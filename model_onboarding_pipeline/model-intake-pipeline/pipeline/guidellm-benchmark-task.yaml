apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: guidellm-benchmark
spec:
  description: Submit a GuideLLM benchmark via EvalHub, poll for completion, and save results.
  params:
    - name: target
      type: string
      description: "Model inference endpoint URL (v1/completions or v1/chat)."
      default: 'http://llama32-3b.llama-serve.svc.cluster.local:8000/v1'
    - name: model-name
      type: string
      description: "Model name identifier."
      default: llama32
    - name: evalhub-url
      type: string
      description: "EvalHub base URL (e.g. evalhub-redhat-ods-applications.apps.<cluster>)."
    - name: evalhub-token
      type: string
      description: "Bearer token for EvalHub API (OpenShift OAuth token)."
    - name: tenant-ns
      type: string
      description: "Tenant namespace for EvalHub (must have evalhub.trustyai.* label)."
    - name: guidellm-profile
      type: string
      default: "constant"
      description: "GuideLLM benchmark profile (constant, sweep, throughput)."
    - name: guidellm-rate
      type: string
      default: "4"
      description: "Request rate for benchmark (rps, comma-separated for sweep)."
    - name: guidellm-max-seconds
      type: string
      default: "60"
      description: "Maximum benchmark duration in seconds."
    - name: guidellm-max-requests
      type: string
      default: "40"
      description: "Maximum number of benchmark requests."
    - name: guidellm-prompt-tokens
      type: string
      default: "256"
      description: "Synthetic prompt size in tokens."
    - name: guidellm-output-tokens
      type: string
      default: "128"
      description: "Synthetic generated-output size in tokens."
    - name: poll-timeout-seconds
      type: string
      default: "2700"
      description: "How long to wait for the EvalHub job to finish (seconds)."
  results:
    - name: evalhub-job-id
      description: "EvalHub job ID for the guidellm benchmark (linked from model registry)."
    - name: benchmark-results
      description: "Summary of benchmark results."
      type: string
  workspaces:
    - name: shared-workspace
      description: Shared workspace for storing benchmark results
  steps:
    - name: run-evalhub-guidellm
      image: registry.access.redhat.com/ubi9/python-311
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: EVALHUB_URL
          value: $(params.evalhub-url)
        - name: EVALHUB_TOKEN
          value: $(params.evalhub-token)
        - name: TENANT_NS
          value: $(params.tenant-ns)
        - name: TARGET_URL
          value: $(params.target)
        - name: MODEL_NAME
          value: $(params.model-name)
        - name: GUIDELLM_PROFILE
          value: $(params.guidellm-profile)
        - name: GUIDELLM_RATE
          value: $(params.guidellm-rate)
        - name: GUIDELLM_MAX_SECONDS
          value: $(params.guidellm-max-seconds)
        - name: GUIDELLM_MAX_REQUESTS
          value: $(params.guidellm-max-requests)
        - name: GUIDELLM_PROMPT_TOKENS
          value: $(params.guidellm-prompt-tokens)
        - name: GUIDELLM_OUTPUT_TOKENS
          value: $(params.guidellm-output-tokens)
        - name: POLL_TIMEOUT_SECONDS
          value: $(params.poll-timeout-seconds)
        - name: WORKSPACE_PATH
          value: $(workspaces.shared-workspace.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- EvalHub GuideLLM Benchmark ---"
        echo "Model: $MODEL_NAME"
        echo "Target: $TARGET_URL"
        echo "EvalHub: $EVALHUB_URL"
        echo "Tenant: $TENANT_NS"
        echo "Profile: $GUIDELLM_PROFILE | Rate: $GUIDELLM_RATE | Max seconds: $GUIDELLM_MAX_SECONDS | Max requests: $GUIDELLM_MAX_REQUESTS"
        echo "Data: prompt_tokens=$GUIDELLM_PROMPT_TOKENS,output_tokens=$GUIDELLM_OUTPUT_TOKENS"
        echo "Poll timeout: ${POLL_TIMEOUT_SECONDS}s"
        echo ""

        export PIP_DISABLE_PIP_VERSION_CHECK=1
        pip install -q requests pyyaml 2>&1 | grep -v "already satisfied" || true

        python3 - << 'PYEOF'
        import json, os, sys, time, warnings, urllib3
        warnings.filterwarnings("ignore")

        evalhub_url = os.environ["EVALHUB_URL"]
        token = os.environ.get("EVALHUB_TOKEN", "").strip()
        if not token:
            with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                token = f.read().strip()
        tenant_ns = os.environ["TENANT_NS"]
        target = os.environ["TARGET_URL"]
        model_name = os.environ["MODEL_NAME"]
        profile = os.environ.get("GUIDELLM_PROFILE", "constant")
        rate = os.environ.get("GUIDELLM_RATE", "4")
        max_seconds = int(os.environ.get("GUIDELLM_MAX_SECONDS", "60"))
        max_requests = int(os.environ.get("GUIDELLM_MAX_REQUESTS", "40"))
        prompt_tokens = int(os.environ.get("GUIDELLM_PROMPT_TOKENS", "256"))
        output_tokens = int(os.environ.get("GUIDELLM_OUTPUT_TOKENS", "128"))
        data_spec = "prompt_tokens={},output_tokens={}".format(prompt_tokens, output_tokens)
        poll_timeout = int(os.environ.get("POLL_TIMEOUT_SECONDS", "2700"))
        ws = os.environ.get("WORKSPACE_PATH", "/workspace/shared-workspace")

        import requests as r
        sess = r.Session()
        sess.headers.update({
            "Authorization": "Bearer " + token,
            "X-Tenant": tenant_ns,
        })

        base = "https://{}/api/v1/evaluations".format(evalhub_url)

        print("--- Submitting guidellm job to EvalHub ---")
        parameters = {
            "profile": profile,
            "rate": float(rate) if rate else 4.0,
            "max_seconds": max_seconds,
            "max_requests": max_requests,
            "warmup": "0",
            "data": data_spec,
        }
        print("Parameters:", json.dumps(parameters))
        payload = {
            "name": "{}-guidellm-bench".format(model_name),
            "model": {
                "url": target,
                "name": model_name,
            },
            "benchmarks": [
                {
                    "id": "constant",
                    "provider_id": "guidellm",
                    # EvalHub copies this into job.json as "parameters".
                    # "config" is ignored and GuideLLM then falls back to a
                    # 10-step sweep (the previous 15-min timeout).
                    "parameters": parameters,
                }
            ],
        }
        resp = sess.post(base + "/jobs", json=payload, verify=False)
        print("Response:", resp.status_code)
        if resp.status_code not in (200, 201, 202):
            print("ERROR submitting job:", resp.text)
            sys.exit(1)
        data = resp.json()
        resource = data.get("resource", data)
        job_id = resource.get("id", resource.get("metadata", {}).get("id", ""))
        print("Job ID:", job_id)

        with open(os.path.join(ws, "guidellm-evalhub-job-id.txt"), "w") as f:
            f.write(job_id)

        print("--- Polling for completion (timeout {}s) ---".format(poll_timeout))
        deadline = time.time() + poll_timeout
        attempt = 0
        state = "unknown"
        job = {}
        while time.time() < deadline:
            time.sleep(15)
            attempt += 1
            resp = sess.get(base + "/jobs/" + job_id, verify=False)
            if resp.status_code != 200:
                print("  [{}] Poll error: {} {}".format(attempt, resp.status_code, resp.text[:200]))
                continue
            job = resp.json()
            state = job.get("status", {}).get("state", "unknown")
            print("  [{}] State: {}".format(attempt, state))
            if state in ("completed", "failed", "cancelled"):
                break
        else:
            print("ERROR: Timed out waiting for EvalHub job after {}s.".format(poll_timeout))
            sys.exit(1)

        print("\n--- Job final state: {} ---".format(state))

        TIMESTAMP = time.strftime("%Y%m%d_%H%M%S")
        RESULT_DIR = os.path.join(ws, "{}_{}".format(TIMESTAMP, model_name))
        os.makedirs(RESULT_DIR, exist_ok=True)

        with open(os.path.join(RESULT_DIR, "evalhub-job.json"), "w") as f:
            json.dump(job, f, indent=2)

        # EvalHub puts metrics at results.benchmarks[0].metrics, not status.results.
        payload_results = job.get("results") or {}
        bench_list = payload_results.get("benchmarks") or []
        metrics = {}
        test = payload_results.get("test") or {}
        if bench_list:
            metrics = bench_list[0].get("metrics") or {}
            test = bench_list[0].get("test") or test
        if not metrics:
            metrics = job.get("status", {}).get("results") or {}
        output_tps = metrics.get("output_tokens_per_second", metrics.get("output_tps", 0))
        reqs_per_sec = metrics.get("requests_per_second", metrics.get("rps", 0))
        mean_ttft = metrics.get("mean_ttft_ms", metrics.get("mean_ttft", 0))
        mean_itl = metrics.get("mean_itl_ms", metrics.get("mean_itl", 0))
        prompt_tps = metrics.get("prompt_tokens_per_second", 0)
        job_passed = test.get("pass", metrics.get("pass", metrics.get("passed", False)))

        summary = {
            "model": model_name,
            "target": target,
            "evalhub_job_id": job_id,
            "profile": profile,
            "rate": rate,
            "max_seconds": max_seconds,
            "max_requests": max_requests,
            "prompt_tokens": prompt_tokens,
            "output_tokens": output_tokens,
            "timestamp": TIMESTAMP,
            "output_tokens_per_second": output_tps,
            "prompt_tokens_per_second": prompt_tps,
            "requests_per_second": reqs_per_sec,
            "mean_ttft_ms": mean_ttft,
            "mean_itl_ms": mean_itl,
            "passed": job_passed,
        }

        with open(os.path.join(RESULT_DIR, "{}-results.yaml".format(model_name)), "w") as f:
            import yaml
            yaml.dump(summary, f, default_flow_style=False)

        with open(os.path.join(RESULT_DIR, "benchmark_info.txt"), "w") as f:
            f.write("Model: {}\n".format(model_name))
            f.write("Target: {}\n".format(target))
            f.write("Profile: {}\n".format(profile))
            f.write("Rate: {}\n".format(rate))
            f.write("Max Seconds: {}\n".format(max_seconds))
            f.write("Max Requests: {}\n".format(max_requests))
            f.write("Data: {}\n".format(data_spec))
            f.write("Timestamp: {}\n".format(TIMESTAMP))
            f.write("EvalHub Job ID: {}\n".format(job_id))
            f.write("Output tokens/sec: {}\n".format(output_tps))
            f.write("Prompt tokens/sec: {}\n".format(prompt_tps))
            f.write("Requests/sec: {}\n".format(reqs_per_sec))
            f.write("Mean TTFT: {} ms\n".format(mean_ttft))
            f.write("Mean ITL: {} ms\n".format(mean_itl))

        # Copy results to workspace root with timestamp prefix so the upload
        # task's glob *${timestamp}* finds them.
        import shutil
        for fname in os.listdir(RESULT_DIR):
            src = os.path.join(RESULT_DIR, fname)
            dst = os.path.join(ws, "{}_{}".format(TIMESTAMP, fname))
            if os.path.isfile(src):
                shutil.copy(src, dst)

        # Write timestamp for downstream upload+registry tasks
        with open(os.path.join(ws, "timestamp.txt"), "w") as f:
            f.write(TIMESTAMP)

        print("\n--- Benchmark Summary ---")
        print("Output tokens/sec: {}".format(output_tps))
        print("Prompt tokens/sec: {}".format(prompt_tps))
        print("Requests/sec: {}".format(reqs_per_sec))
        print("Mean TTFT: {} ms".format(mean_ttft))
        print("Mean ITL: {} ms".format(mean_itl))
        print("Passed: {}".format(job_passed))
        print("Results saved to: {}".format(RESULT_DIR))
        PYEOF
