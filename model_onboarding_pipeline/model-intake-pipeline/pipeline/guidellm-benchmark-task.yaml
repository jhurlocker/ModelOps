apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: guidellm-benchmark
spec:
  description: Submit a GuideLLM benchmark via EvalHub, poll for completion, and save results.

    TLS trust for EvalHub HTTPS requests is provided by an OpenShift service
    CA bundle mounted from the ConfigMap default-evalhub-service-ca (provisioned
    by the TrustyAI Operator when the namespace carries the label
    evalhub.trustyai.opendatahub.io/tenant). The ConfigMap's service-ca.crt key
    is populated asynchronously by OpenShift's service.beta.openshift.io/
    inject-cabundle annotation after the namespace is labeled -- a PipelineRun
    executed immediately after a namespace is first labeled (rather than against
    a long-lived, already-labeled namespace) could race the injection. Not
    engineered around for this phase; tracked as a known race window.
  params:
    - name: target
      type: string
      description: "Model inference endpoint URL (v1/completions or v1/chat)."
      default: 'http://llama32-3b.llama-serve.svc.cluster.local:8000/v1'
    - name: model-name
      type: string
      description: "Model name identifier."
      default: llama32
    - name: evalhub-url
      type: string
      description: "EvalHub base URL (e.g. evalhub-redhat-ods-applications.apps.<cluster>)."
    - name: evalhub-secret-name
      type: string
      description: >-
        Name of a Secret (in this Task's namespace) with a "token" key
        (Bearer token for the EvalHub API), consumed via secretKeyRef
        (optional: true). Never a token value itself.
    - name: tenant-ns
      type: string
      description: "Tenant namespace for EvalHub (must have evalhub.trustyai.* label)."
    - name: guidellm-profile
      type: string
      default: "constant"
      description: "GuideLLM benchmark profile (constant, sweep, throughput)."
    - name: guidellm-rate
      type: string
      default: "1"
      description: "Request rate for benchmark (rps, comma-separated for sweep)."
    - name: guidellm-max-seconds
      type: string
      default: "30"
      description: "Maximum benchmark duration in seconds."
    - name: guidellm-max-requests
      type: string
      default: "5"
      description: "Maximum number of benchmark requests."
  results:
    - name: evalhub-job-id
      description: "EvalHub job ID for the guidellm benchmark (linked from model registry)."
    - name: benchmark-results
      description: "Summary of benchmark results."
      type: string
  volumes:
    - name: evalhub-service-ca
      configMap:
        name: default-evalhub-service-ca
  workspaces:
    - name: shared-workspace
      description: Shared workspace for storing benchmark results
  steps:
    - name: run-evalhub-guidellm
      image: quay.io/jhurlocker/guidellm-benchmark:v0.1.5
      workingDir: $(workspaces.shared-workspace.path)
      volumeMounts:
        - name: evalhub-service-ca
          mountPath: /etc/evalhub-ca
          readOnly: true
      env:
        - name: REQUESTS_CA_BUNDLE
          value: /etc/evalhub-ca/service-ca.crt
        - name: EVALHUB_URL
          value: $(params.evalhub-url)
        - name: EVALHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.evalhub-secret-name)
              key: token
              optional: true
        - name: TENANT_NS
          value: $(params.tenant-ns)
        - name: TARGET
          value: $(params.target)
        - name: MODEL_NAME
          value: $(params.model-name)
        - name: GUIDELLM_PROFILE
          value: $(params.guidellm-profile)
        - name: GUIDELLM_RATE
          value: $(params.guidellm-rate)
        - name: GUIDELLM_MAX_SECONDS
          value: $(params.guidellm-max-seconds)
        - name: GUIDELLM_MAX_REQUESTS
          value: $(params.guidellm-max-requests)
        - name: WORKSPACE_PATH
          value: $(workspaces.shared-workspace.path)
      args:
        - full
