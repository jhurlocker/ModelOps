apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-db-pvc
  namespace: redhat-ods-applications
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-credentials
  namespace: redhat-ods-applications
stringData:
  POSTGRESQL_USER: maas
  POSTGRESQL_PASSWORD: maas-demo-password
  POSTGRESQL_DATABASE: maas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-db
  namespace: redhat-ods-applications
  labels:
    app: maas-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-db
  template:
    metadata:
      labels:
        app: maas-db
    spec:
      securityContext:
        fsGroup: 26
      initContainers:
        - name: fix-permissions
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - mkdir -p /var/lib/pgsql/data/userdata && chown -R 26:26 /var/lib/pgsql/data && chmod 700 /var/lib/pgsql/data /var/lib/pgsql/data/userdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: maas-db-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: maas-db
  namespace: redhat-ods-applications
  labels:
    app: maas-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: maas-db
