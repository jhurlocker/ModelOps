---
# ===================================================================
#  1. PVC for the SQLite datastore (plans + submitted runs)
# ===================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-intake-data
  namespace: vllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# ===================================================================
#  2. CONFIG
#  Non-secret defaults shown to/prefilled in the intake form. Adjust
#  to match your cluster's S3/pipeline naming.
# ===================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-intake-config
  namespace: vllm
data:
  PIPELINE_NAMESPACE: "vllm"
  PIPELINE_NAME: "model-intake-pipeline"
  PIPELINE_SERVICE_ACCOUNT: "pipeline"
  SHARED_WORKSPACE_PVC: "guidellm-output-pvc"
  MANIFESTS_CONFIGMAP: "mmlu-manifest"
  CUSTOM_MMLU_CONFIGMAP: "custom-mmlu"
  SELF_INTERNAL_URL: "http://model-intake.vllm.svc.cluster.local:8080"
  DEFAULT_S3_ENDPOINT: "http://minio-service.s3-storage.svc.cluster.local:9000"
  # Set to the same RunPod/agentic-skill endpoint used by the gpu-advisor
  # Task if you want it prefilled in the intake form (still overridable
  # per-submission).
  DEFAULT_ADVISOR_ENDPOINT: ""

---
# ===================================================================
#  3. SECRET
#  Default S3 credentials used to prefill the intake form. These are
#  the SAME MinIO credentials used elsewhere in this repo - replace
#  with real values / a proper secret manager in production.
# ===================================================================
apiVersion: v1
kind: Secret
metadata:
  name: model-intake-secrets
  namespace: vllm
type: Opaque
stringData:
  DEFAULT_S3_ACCESS_KEY: "minio"
  DEFAULT_S3_SECRET_KEY: "minio123"

---
# ===================================================================
#  4. RBAC
#  The app needs to create/list/get PipelineRuns (and read Pipelines)
#  in its namespace so the intake form can trigger runs and the runs
#  list/detail pages can show live status.
# ===================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-intake
  namespace: vllm

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-intake-tekton
  namespace: vllm
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-intake-tekton
  namespace: vllm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-intake-tekton
subjects:
  - kind: ServiceAccount
    name: model-intake
    namespace: vllm

---
# ===================================================================
#  5. DEPLOYMENT
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-intake
  namespace: vllm
  labels:
    app: model-intake
spec:
  replicas: 1
  strategy:
    type: Recreate # single-replica app backed by a RWO PVC (SQLite)
  selector:
    matchLabels:
      app: model-intake
  template:
    metadata:
      labels:
        app: model-intake
    spec:
      serviceAccountName: model-intake
      containers:
        - name: app
          image: quay.io/jhurlocker/model-intake-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: model-intake-config
            - secretRef:
                name: model-intake-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: model-intake-data
      restartPolicy: Always

---
# ===================================================================
#  6. SERVICE
#  Internal DNS name used by the wait-for-approval Task (approval-api-url
#  param defaults to http://model-intake.vllm.svc.cluster.local:8080).
# ===================================================================
apiVersion: v1
kind: Service
metadata:
  name: model-intake
  namespace: vllm
  labels:
    app: model-intake
spec:
  selector:
    app: model-intake
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080

---
# ===================================================================
#  7. ROUTE
#  Public URL for humans to submit models and approve/reject plans.
# ===================================================================
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: model-intake
  namespace: vllm
  labels:
    app: model-intake
spec:
  to:
    kind: Service
    name: model-intake
    weight: 100
  port:
    targetPort: 8080-tcp
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
