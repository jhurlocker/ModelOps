{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Not Found</h1>
    <p>Plan <strong>{{ plan_id }}</strong> was not found in the approval database.</p>
</div>
<div class="empty-state">
    <h3>Plan not found</h3>

    <a href="/approvals" class="btn btn-primary" style="margin-top:12px">Back to Approvals</a>
</div>
{% endblock %}
