---
# ===================================================================
#  1. THE SECRET
#  MinIO credentials used by the results viewer. These match the
#  pipeline defaults - replace for production.
# ===================================================================
apiVersion: v1
kind: Secret
metadata:
  name: s3-creds
type: Opaque
stringData:
  S3_BUCKET_NAME: "benchmark-results"
  S3_SECURITY_BUCKET: "security-scan-results"
  S3_ACCESS_KEY: "minio"
  S3_SECRET_KEY: "minio123"
  S3_ENDPOINT_URL: "http://minio-service.s3-storage.svc.cluster.local:9000"

---
# ===================================================================
#  2. THE DEPLOYMENT
#  Built from this repo (ImageStream benchmark-viewer:latest).
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-viewer
  labels:
    app: benchmark-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-viewer
  template:
    metadata:
      labels:
        app: benchmark-viewer
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/vllm/benchmark-viewer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: s3-creds
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-viewer
  labels:
    app: benchmark-viewer
spec:
  selector:
    app: benchmark-viewer
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: benchmark-viewer
  labels:
    app: benchmark-viewer
spec:
  to:
    kind: Service
    name: benchmark-viewer
    weight: 100
  port:
    targetPort: 8080-tcp
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
