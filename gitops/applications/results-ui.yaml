apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: results-ui
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: modelops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: modelops
  source:
    repoURL: https://github.com/jhurlocker/ModelOps.git
    targetRevision: feat/model-request-controller
    path: gitops/components/results-ui
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
