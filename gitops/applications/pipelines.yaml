apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: modelops-pipelines
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: modelops
spec:
  project: modelops
  source:
    repoURL: https://github.com/jhurlocker/ModelOps.git
    targetRevision: feat/model-request-controller
    path: model_onboarding_pipeline/model-intake-pipeline/pipeline
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
