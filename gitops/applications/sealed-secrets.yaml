apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: modelops
  annotations:
    # Sync at wave -1, alongside argocd-config/maas-prereqs and ahead of
    # every wave-0+ Application, so the controller (CRD + cluster-wide RBAC
    # + kube-system Deployment) is ready to decrypt SealedSecrets before any
    # component that depends on one syncs. Without this ordering a fresh
    # bootstrap would leave SealedSecrets Pending (CRD not yet registered)
    # or create empty Secrets until the controller comes up.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: modelops
  source:
    repoURL: https://github.com/jhurlocker/ModelOps.git
    targetRevision: feat/model-request-controller
    path: gitops/components/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "5m"
