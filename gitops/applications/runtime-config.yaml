apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: modelops-runtime-config
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: modelops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: modelops
  source:
    repoURL: https://github.com/jhurlocker/ModelOps.git
    targetRevision: feat/model-request-controller
    path: gitops/components/runtime-config
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "5m"
  ignoreDifferences:
    # The Service CA operator asynchronously writes the injected `service-ca.crt`
    # into this ConfigMap's data on the live cluster, after ArgoCD has synced
    # the (annotation-only) Git state. Without this, ArgoCD's self-heal would
    # see the injected data as drift and strip it, racing the operator and
    # intermittently leaving the mounted CA bundle empty. Ignore data so the
    # operator-owned field survives. See gitops/components/runtime-config/
    # zot-service-ca.yaml.
    - group: ""
      kind: ConfigMap
      name: zot-service-ca
      namespace: sandbox
      jqPathExpressions:
        - .data
