apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modellifecycleprofiles.modelops.example.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: modelops.example.io
  names:
    kind: ModelLifecycleProfile
    listKind: ModelLifecycleProfileList
    plural: modellifecycleprofiles
    singular: modellifecycleprofile
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - workflow
              properties:
                workflow:
                  type: object
                  required:
                    - engine
                    - pipelineRef
                  properties:
                    engine:
                      type: string
                      description: Workflow engine (e.g. tekton)
                    pipelineRef:
                      type: string
                      description: Name of the pipeline to execute
                policyRef:
                  type: string
                  description: Name of the onboarding policy resource
                platformConfigRef:
                  type: string
                  description: Name of the PlatformConfig with shared platform defaults
                defaultAccess:
                  type: object
                  properties:
                    authorizedViewers:
                      type: string
                    accessRole:
                      type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Engine
          type: string
          jsonPath: .spec.workflow.engine
        - name: Pipeline
          type: string
          jsonPath: .spec.workflow.pipelineRef
