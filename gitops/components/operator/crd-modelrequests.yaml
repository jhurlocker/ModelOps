---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: modelrequests.modelops.example.io
spec:
  group: modelops.example.io
  names:
    kind: ModelRequest
    listKind: ModelRequestList
    plural: modelrequests
    singular: modelrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.pipelineRunName
      name: PipelineRun
      type: string
    - jsonPath: .spec.model.uri
      name: Model
      type: string
    - jsonPath: .spec.lifecycleProfile
      name: Profile
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              access:
                properties:
                  accessRole:
                    type: string
                  authorizedViewers:
                    type: string
                type: object
              businessJustification:
                type: string
              displayName:
                type: string
              evalhubSecretName:
                type: string
              huggingfaceSecretName:
                type: string
              lifecycleProfile:
                type: string
              maas:
                properties:
                  authorizedGroup:
                    type: string
                  enabled:
                    type: boolean
                  gpuCount:
                    type: string
                  runtimeImage:
                    type: string
                type: object
              model:
                properties:
                  name:
                    type: string
                  sourceType:
                    type: string
                  tokenizer:
                    type: string
                  uri:
                    type: string
                  version:
                    type: string
                required:
                - sourceType
                - uri
                type: object
              pipelineRef:
                type: string
              requestedBy:
                type: string
              requirements:
                description: |-
                  ModelRequirements is composed of logical sub-structs grouping related
                  concerns (GPU/hardware, benchmark targets, security, deployment). Each
                  sub-struct is embedded anonymously with `json:",inline"` so its fields
                  remain flat, top-level siblings on the wire -- this is what keeps an
                  existing ModelRequest CR's `requirements:` YAML shape unchanged (e.g.
                  `gpuCountOverride: ...` stays `gpuCountOverride: ...`, it does not
                  become `gpuConfig.gpuCountOverride: ...`). See docs/REFACTOR_PLAN.md
                  Phase 2 and docs/PHASE_LOG.md for the rationale.

                  A handful of fields (target environment and namespace selection) don't
                  fit any of the four grouped concerns cleanly and are left flat directly
                  on ModelRequirements, matching their pre-Phase-2 shape.
                properties:
                  advisorEndpoint:
                    type: string
                  allowMIG:
                    type: boolean
                  allowTimeSlicing:
                    type: boolean
                  contextLength:
                    type: integer
                  customBenchmarkData:
                    type: boolean
                  customBenchmarkFile:
                    type: string
                  cveThreshold:
                    type: string
                  expectedConcurrency:
                    type: integer
                  gpuCountOverride:
                    type: string
                  gpuIsolationPolicy:
                    type: string
                  openshiftConsoleDomain:
                    type: string
                  promotionNamespaces:
                    items:
                      type: string
                    type: array
                  requestRate:
                    type: string
                  sandboxNamespace:
                    type: string
                  securityThreshold:
                    type: string
                  stagingNamespace:
                    type: string
                  targetEnvironment:
                    type: string
                  targetTTFT:
                    type: string
                  targetThroughput:
                    type: string
                  valuesContent:
                    type: string
                type: object
              resultS3Bucket:
                type: string
              resultS3Endpoint:
                description: |-
                  ResultS3Endpoint overrides the S3-compatible endpoint used for
                  scan/benchmark result storage. Credentials are never accepted here
                  -- they must be resolved via ResultS3SecretName's secretRef.
                type: string
              resultS3SecretName:
                type: string
              scanS3SecretName:
                type: string
            required:
            - lifecycleProfile
            - model
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentStage:
                description: |-
                  CurrentStage is the ProfileStageSpec.Name the generic stage
                  walker is currently on (or was on when the ModelRequest reached
                  a terminal phase). Introduced in Phase 6 -- additive, not a
                  replacement for Phase.
                type: string
              message:
                type: string
              phase:
                description: |-
                  Phase is the coarse-grained onboarding phase. Always fully
                  generic as of Phase 7 (REFACTOR_PLAN.md):
                  "<CurrentStage>Running"/"Succeeded"/"Failed" (CurrentStage/
                  Failed/Succeeded messages come from result.Message verbatim), or
                  one of the *LookupFailed/*SetupFailed/NoStagesConfigured reasons
                  for a config/lookup error. Prior to Phase 7, the synthesized
                  default 3-stage sequence (defaultStages, now removed) got a
                  special-cased set of pre-Phase-6 values instead
                  ("CapacityPlanning"/"SandboxRunning"/"PromotionRunning") via a
                  compatibility shim in internal/controller's computeWalkStatus --
                  removed once every ModelLifecycleProfile in this repo migrated to
                  declaring Spec.Stages explicitly. See docs/PHASE_LOG.md's Phase 7
                  entry for the exact before/after values.
                type: string
              pipelineRunName:
                description: |-
                  Deprecated: PipelineRunName is retained for compatibility with the
                  Tekton-based reference implementation. Consumers should prefer
                  Stages[] for provider-independent lifecycle tracking.
                type: string
              promotionPipelineRunName:
                description: |-
                  Deprecated: PromotionPipelineRunName is retained for compatibility
                  with the Tekton-based reference implementation. Consumers should
                  prefer Stages[] for provider-independent lifecycle tracking.
                type: string
              sandboxPipelineRunName:
                description: |-
                  Deprecated: SandboxPipelineRunName is retained for compatibility
                  with the Tekton-based reference implementation. Consumers should
                  prefer Stages[] for provider-independent lifecycle tracking.
                type: string
              stages:
                description: |-
                  Stages records, in profile order, the most recent outcome for
                  every (stage, namespace) pair the walker has attempted -- one
                  entry per namespace for a PerNamespace stage. This is what makes
                  `kubectl get modelrequest` show meaningful progress against the
                  profile's declared stage list. Introduced in Phase 6.
                items:
                  description: |-
                    StageProgress is one (stage, namespace) outcome recorded by the
                    generic stage walker. Phase mirrors stagecommon.StagePhase's string
                    values ("Running"/"Succeeded"/"Failed") as a plain string so this API
                    package doesn't depend on internal/stagecommon.
                  properties:
                    checkResults:
                      description: |-
                        CheckResults is optional per-check governance evidence, distinct
                        from and in addition to the stage's single aggregate Phase.
                        Populated only when a stage has multiple CheckTypes and the
                        provider can produce structured per-check output. A consumer
                        querying governance evidence should consult this field, not
                        derive check outcomes from Phase.
                      items:
                        description: |-
                          CheckResult is optional per-check granular governance evidence a
                          StageRunner may populate alongside the stage's aggregate Phase. Only
                          meaningful when a stage's ProfileStageSpec.CheckTypes has more than
                          one entry (the combined case). Deliberately a plain struct in
                          api/v1alpha1 rather than imported from internal/stagecommon -- same
                          decoupling principle as StageProgress.Phase (a plain string, not
                          stagecommon.StagePhase).
                        properties:
                          message:
                            type: string
                          passed:
                            type: boolean
                          reason:
                            type: string
                          type:
                            description: |-
                              CheckType classifies what kind of governance/validation check a stage
                              performs. This is a validated CRD enum -- deliberately the opposite
                              choice from Kind (unvalidated, Phase 6) -- for exactly one reason:
                              checkTypes is a curated governance vocabulary that audit tooling will
                              eventually query against ("show me every ModelRequest where a
                              ComplianceScan stage Failed"), so a typo here should be a rejected
                              write, not a silent gap in the evidence chain. A new check type is a
                              deliberate nouns-to-the-taxonomy change the project should approve
                              explicitly, not something one user should be able to silently add by
                              misspelling "SecurityScan" and having nothing reconcile it.
                            enum:
                            - SecurityScan
                            - ComplianceScan
                            - Benchmark
                            type: string
                        required:
                        - passed
                        - type
                        type: object
                      type: array
                    detailsURL:
                      description: |-
                        DetailsURL is an optional human-facing link out to the provider's
                        own console, logs, or job page. Set only by providers whose
                        execution surface is genuinely external (webhook provider, via
                        its statusMapping.detailsUrlTemplate); every other provider
                        leaves it empty.
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    phase:
                      type: string
                    runRef:
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
