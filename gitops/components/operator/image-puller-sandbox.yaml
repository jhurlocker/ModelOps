# Allows the pipeline ServiceAccount (in the ModelRequest namespace, "sandbox")
# to pull the containerized tool images built into the "modelops" namespace's
# internal registry (the operator's established build path: oc new-build
# --binary). These are the natural-language/tool images the Tekton Tasks
# reference by digest (image-registry.openshift-image-registry.svc:5000/
# modelops/<tool>@sha256:...). This mirrors "oc policy add-role-to-user
# system:image-puller system:serviceaccount:sandbox:pipeline -n modelops".
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modelops-tools-image-puller-sandbox-pipeline
  namespace: modelops
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: sandbox
roleRef:
  kind: ClusterRole
  name: system:image-puller
  apiGroup: rbac.authorization.k8s.io
