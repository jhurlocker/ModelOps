apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelops-operator
  namespace: modelops
  labels:
    app: modelops-operator
    app.kubernetes.io/name: modelops-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modelops-operator
  template:
    metadata:
      labels:
        app: modelops-operator
    spec:
      serviceAccountName: modelops-operator
      containers:
        - name: manager
          image: quay.io/jhurlocker/modelops-operator:v0.2.4
          imagePullPolicy: Always
          command:
            - /usr/local/bin/manager
          args:
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 10
