apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modelops-operator-controller
  labels:
    app.kubernetes.io/name: modelops-operator
rules:
  - apiGroups:
      - modelops.example.io
    resources:
      - modelrequests
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - modelops.example.io
    resources:
      - modelrequests/finalizers
    verbs:
      - update
  - apiGroups:
      - modelops.example.io
    resources:
      - modelrequests/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - modelops.example.io
    resources:
      - modellifecycleprofiles
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - modelops.example.io
    resources:
      - platformconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - modelops.example.io
    resources:
      - capacityplans
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - modelops.example.io
    resources:
      - capacityplans/finalizers
    verbs:
      - update
  - apiGroups:
      - modelops.example.io
    resources:
      - capacityplans/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
