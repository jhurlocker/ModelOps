apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: default-free
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: Default Free Tier
    openshift.io/description: Free tier subscription for granite-2b (100 tokens/min)
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: granite-2b
      namespace: staging
      tokenRateLimits:
        - limit: 100
          window: "1m"
  priority: 10
