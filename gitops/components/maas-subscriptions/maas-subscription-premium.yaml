apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: default-premium
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: Default Premium Tier
    openshift.io/description: Premium tier subscription for granite-2b (100000 tokens/min)
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: granite-2b
      namespace: staging
      tokenRateLimits:
        - limit: 100000
          window: "1m"
  priority: 20
