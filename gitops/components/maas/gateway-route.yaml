---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-gateway
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Cluster-specific: rendered at build time from cluster-config.yaml by
  # the kustomize replacement in kustomization.yaml (must match the
  # Gateway's HTTPS listener hostname so passthrough SNI/name filtering
  # works). Do NOT hardcode a cluster domain here. The empty value below
  # is only ever applied if this Route is consumed without the kustomize
  # replacement, in which case OpenShift would auto-generate a host.
  host: ""
  to:
    kind: Service
    name: maas-default-gateway-data-science-gateway-class
    weight: 100
  port:
    targetPort: 443
  tls:
    termination: passthrough
