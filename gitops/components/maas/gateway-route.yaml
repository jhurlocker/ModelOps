---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-gateway
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Cluster-specific: the hostname follows the pattern maas.apps.<cluster-domain>.
  # Find your cluster domain: oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}'
  host: maas.apps.ocp.mb9bl.sandbox1545.opentlc.com
  to:
    kind: Service
    name: maas-default-gateway-data-science-gateway-class
    weight: 100
  port:
    targetPort: 443
  tls:
    termination: passthrough
