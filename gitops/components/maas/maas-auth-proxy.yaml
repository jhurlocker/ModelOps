apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-auth-proxy-script
  namespace: redhat-ods-applications
data:
  proxy.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from urllib.request import Request, urlopen
    from urllib.error import HTTPError, URLError
    import ssl, json, sys

    MAAS_API = "https://maas-api.redhat-ai-gateway-infra.svc.cluster.local:8443"
    K8S_API = "https://kubernetes.default.svc/apis/user.openshift.io/v1/users/~"
    ctx = ssl.create_default_context()
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE

    class Proxy(BaseHTTPRequestHandler):
        def do_ANY(self):
            print(f"REQUEST: {self.command} {self.path}", file=sys.stderr)
            for k, v in self.headers.items():
                print(f"  HEADER: {k}={v[:80] if len(v)>80 else v}", file=sys.stderr)
            auth = self.headers.get("Authorization", "")
            if not auth.startswith("Bearer "):
                print(f"NO BEARER TOKEN: auth={auth[:20]}", file=sys.stderr)
                self.send_error(401, "missing bearer token")
                return
            token = auth.split("Bearer ", 1)[1]
            print(f"TOKEN: {token[:20]}...", file=sys.stderr)
            try:
                req = Request(K8S_API, headers={"Authorization": f"Bearer {token}"})
                resp = urlopen(req, context=ctx)
                data = json.loads(resp.read())
                user = data["metadata"]["name"]
                groups = json.dumps(data.get("groups", []))
                print(f"USER: {user}, GROUPS: {groups}", file=sys.stderr)
            except Exception as e:
                print(f"k8s api error: {e}", file=sys.stderr)
                self.send_error(502, "auth failed")
                return
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length) if length > 0 else None
            url = MAAS_API + self.path
            try:
                req = Request(url, data=body, method=self.command)
                req.add_header("X-MaaS-Username", user)
                req.add_header("X-MaaS-Group", groups)
                req.add_header("Content-Type", self.headers.get("Content-Type", "application/json"))
                resp = urlopen(req, context=ctx)
                self.send_response(resp.status)
                for k, v in resp.getheaders():
                    if k.lower() not in ("transfer-encoding", "connection"):
                        self.send_header(k, v)
                self.end_headers()
                self.wfile.write(resp.read())
            except HTTPError as e:
                self.send_response(e.code)
                self.end_headers()
                self.wfile.write(e.read())
            except Exception as e:
                print(f"proxy error: {e}", file=sys.stderr)
                self.send_error(502, "proxy error")

        do_GET = do_POST = do_PUT = do_DELETE = do_PATCH = do_ANY

    print("maas-auth-proxy listening on :8080", file=sys.stderr)
    HTTPServer(("", 8080), Proxy).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-auth-proxy
  namespace: redhat-ods-applications
  labels:
    app: maas-auth-proxy
    app.kubernetes.io/part-of: modelops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-auth-proxy
  template:
    metadata:
      labels:
        app: maas-auth-proxy
    spec:
      containers:
        - name: proxy
          image: image-registry.openshift-image-registry.svc:5000/openshift/python:3.11-ubi9
          command: ["python3", "/scripts/proxy.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: script
          configMap:
            name: maas-auth-proxy-script
---
apiVersion: v1
kind: Service
metadata:
  name: maas-auth-proxy
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: modelops
spec:
  selector:
    app: maas-auth-proxy
  ports:
    - port: 8080
      targetPort: 8080
