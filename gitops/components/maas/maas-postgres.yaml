# The `maas-postgres-credentials` Secret (database password) is a SealedSecret
# (see maas-postgres-credentials-sealedsecret.yaml) — committed encrypted, not
# plaintext. The Deployment below references it via secretKeyRef, unchanged.
# Its password MUST match the one embedded in maas-db-config-sealedsecret.yaml
# (the MaaS API's DB connection URL); rotate them together.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgres
  namespace: maas-infra
  labels:
    app: maas-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-postgres
  template:
    metadata:
      labels:
        app: maas-postgres
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: maas-postgres-credentials
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maas-postgres-credentials
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: maas-postgres-credentials
                  key: database-name
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  namespace: maas-infra
spec:
  selector:
    app: maas-postgres
  ports:
    - port: 5432
      targetPort: 5432
