apiVersion: batch/v1
kind: CronJob
metadata:
  name: fix-gateway-default-auth
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: modelops
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 30
      template:
        spec:
          serviceAccountName: fix-gateway-auth
          restartPolicy: OnFailure
          containers:
            - name: fix
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  APISERVER="https://kubernetes.default.svc"
                  APIPATH="/apis/kuadrant.io/v1/namespaces/openshift-ingress/authpolicies/gateway-default-auth"
                  HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" "${APISERVER}${APIPATH}" 2>/dev/null)
                  if [ "$HTTP_CODE" = "200" ]; then
                    echo "deleting gateway-default-auth"
                    curl -sk -X DELETE -H "Authorization: Bearer ${TOKEN}" "${APISERVER}${APIPATH}" 2>/dev/null
                    echo "deleted"
                  fi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fix-gateway-auth
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: modelops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fix-gateway-auth
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: modelops
rules:
  - apiGroups: ["kuadrant.io"]
    resources: ["authpolicies"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fix-gateway-auth
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: modelops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fix-gateway-auth
subjects:
  - kind: ServiceAccount
    name: fix-gateway-auth
    namespace: openshift-ingress
