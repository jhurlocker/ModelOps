apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: modelops-storage

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  # MinIO root credentials are a SealedSecret (encrypted per-cluster), never
  # plaintext. The deployment references them via secretKeyRef, unchanged.
  # Sealed with `kubeseal` per the gitops/README.md "Secrets setup" bootstrap
  # step. There is deliberately NO Route here: nothing needs MinIO reachable
  # from outside the cluster (in-cluster S3 clients use the internal Service
  # DNS), so neither the S3 API nor the console is exposed externally.
  - minio-credentials-sealedsecret.yaml
