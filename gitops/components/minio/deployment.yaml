apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: modelops-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: rustfs/rustfs:1.0.3
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9090"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            # Log to stdout: the image's /logs is owned by UID 10001, but
            # OpenShift's restricted SCC runs the pod as a namespace-range
            # UID, so /logs is not writable. Emptying this makes the
            # entrypoint stream logs to stdout instead.
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
            - name: RUSTFS_VOLUMES
              value: "/data"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9090
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
