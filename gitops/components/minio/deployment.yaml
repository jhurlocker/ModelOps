apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: modelops-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9090"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            # NOTE: MINIO_BROWSER_REDIRECT_URL (the Console's OIDC login
            # redirect target) is intentionally NOT set. It is only used
            # during OpenID/IDP login, and this deployment has no IDP
            # configured (root user/password only), so the variable is
            # inert. Setting it would require hardcoding the console Route
            # hostname that OpenShift auto-generates as
            # minio-console-<namespace>.apps.<cluster-domain>, duplicating
            # a cluster-specific value this repo deliberately avoids. If an
            # IDP is ever added, derive the redirect target from the real
            # minio-console Route at pod startup instead of hardcoding it.
            - name: MINIO_SERVER_URL
              # Controls the URL MinIO embeds in S3 API responses
              # (presigned URLs, location headers, etc.). In-cluster
              # S3 clients (Tekton pipelines, controllers) connect via
              # the internal Service, so this MUST be internal DNS, not
              # an external Route. TLS is edge-terminated at the Route
              # only; the internal Service is plain HTTP on port 9000.
              value: "http://minio.modelops-storage.svc.cluster.local:9000"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9090
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
