apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: modelops-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9090"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            - name: MINIO_BROWSER_REDIRECT_URL
              # Browser-facing OIDC login redirect: must be the real
              # external Route hostname so a human's browser can resolve
              # it. Update this when deploying to a new cluster (the
              # Route is auto-generated by OpenShift as
              # minio-console-<namespace>.apps.<cluster-domain>).
              value: "https://minio-console-modelops-storage.apps.ocp.tkjpd.sandbox1883.opentlc.com"
            - name: MINIO_SERVER_URL
              # Controls the URL MinIO embeds in S3 API responses
              # (presigned URLs, location headers, etc.). In-cluster
              # S3 clients (Tekton pipelines, controllers) connect via
              # the internal Service, so this MUST be internal DNS, not
              # an external Route. TLS is edge-terminated at the Route
              # only; the internal Service is plain HTTP on port 9000.
              value: "http://minio.modelops-storage.svc.cluster.local:9000"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9090
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
