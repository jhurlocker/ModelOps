apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modelops-namespace-provisioner
  labels:
    app.kubernetes.io/part-of: modelops
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - get
      - list
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelops-namespace-provisioner
  labels:
    app.kubernetes.io/part-of: modelops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: modelops-namespace-provisioner
subjects:
  - kind: ServiceAccount
    name: modelops-operator
    namespace: modelops
