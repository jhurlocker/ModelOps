apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: zot-ui
  namespace: modelops-zot
spec:
  # Zot serves the built-in UI and the registry API on the same port (5000).
  # This Route is for browser access to the UI. The registry API for in-cluster
  # push/pull is NOT consumed through this Route — pipelines use the internal
  # Service DNS (zot.modelops-zot.svc.cluster.local:5000).
  port:
    targetPort: http
  to:
    kind: Service
    name: zot
  tls:
    # passthrough: Zot now serves TLS directly (service-CA-signed serving cert,
    # see service.yaml/configmap.yaml), so the router must not terminate TLS.
    # The browser sees Zot's own service-CA-signed cert (a UI-side cert warning
    # for this sandbox registry, acceptable for its demo use). In-cluster
    # push/pull does not go through this Route at all.
    termination: passthrough
