apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: modelops-zot
spec:
  # In-cluster consumers (Tekton pipeline tasks, future controllers) push/pull
  # through this internal DNS name (zot.modelops-zot.svc.cluster.local:5000),
  # not an external Route. Nothing outside the cluster pushes to Zot, so the
  # registry API is intentionally not exposed via a Route.
  ports:
    - name: http
      port: 5000
      targetPort: http
  selector:
    app: zot
