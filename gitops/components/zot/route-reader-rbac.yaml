# Grants the pipeline ServiceAccount (sandbox) read access to the Zot Route in
# the modelops-zot namespace. build-modelcar's resolve-registry-host step reads
# the Route's auto-generated hostname at runtime so it can emit a ModelCar pull
# reference the NODE can resolve (the internal Service DNS does not resolve from
# the node host). Least-privilege: get-only, scoped to this one namespace and
# this one resource type -- not a cluster-wide route grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zot-route-reader
  namespace: modelops-zot
  labels:
    app.kubernetes.io/part-of: modelops
rules:
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-pipeline-zot-route-reader
  namespace: modelops-zot
  labels:
    app.kubernetes.io/part-of: modelops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zot-route-reader
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: sandbox
