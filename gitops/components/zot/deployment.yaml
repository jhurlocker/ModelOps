apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: modelops-zot
  labels:
    app: zot
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the registry stores a boltdb cache.db on the
  # RWO zot-data PVC, and two pods cannot open the same boltdb file
  # ("boltdb file is already in use"). Recreate terminates the old pod before
  # the new one starts, which is the correct strategy for this single-replica,
  # PVC-backed registry.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:v2.1.20
          # The image's default entrypoint already runs `zot serve /etc/zot/config.json`,
          # which reads the ConfigMap-mounted config below.
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
            - name: htpasswd
              mountPath: /etc/zot/htpasswd
              subPath: htpasswd
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zot-data
        - name: config
          configMap:
            name: zot-config
            items:
              - key: config.json
                path: config.json
        - name: htpasswd
          secret:
            secretName: zot-htpasswd
