apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: modelops-zot

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  # Zot's htpasswd basic-auth credential is a SealedSecret (encrypted
  # per-cluster), mounted at /etc/zot/htpasswd — never inlined in the
  # ConfigMap config.json. It and the zot-push-credentials SealedSecret
  # (runtime-config) are two representations of ONE identity (a bcrypt hash
  # here, the plaintext username+password there); rotate them together.
  # Sealed with `kubeseal` per gitops/README.md's "Secrets setup" step.
  #
  # There is deliberately NO Route here: Zot's built-in UI shares the
  # registry's single port, so an external Route would also expose the
  # push/pull API. Nothing needs Zot reachable from outside the cluster —
  # in-cluster consumers (the build-modelcar Task) use the internal Service
  # DNS zot.modelops-zot.svc.cluster.local:5000.
  - zot-htpasswd-sealedsecret.yaml
