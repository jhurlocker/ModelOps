apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: modelops-zot

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - route-reader-rbac.yaml
  # Zot's htpasswd basic-auth credential is a SealedSecret (encrypted
  # per-cluster), mounted at /etc/zot/htpasswd — never inlined in the
  # ConfigMap config.json. It and the zot-push-credentials SealedSecret
  # (runtime-config) are two representations of ONE identity (a bcrypt hash
  # here, the plaintext username+password there); rotate them together.
  # Sealed with `kubeseal` per gitops/README.md's "Secrets setup" step.
  - zot-htpasswd-sealedsecret.yaml
