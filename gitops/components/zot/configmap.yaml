apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: modelops-zot
data:
  # Zot's configuration file, mounted at /etc/zot/config.json.
  # Config reference: https://zotregistry.dev/v2.1.20/admin-guide/admin-configuration/
  # The UI is Zot's built-in web interface, enabled via the `ui` extension
  # under `extensions` (a full-featured image is required; minimal builds ignore it).
  # Zot requires the `search` extension to be enabled alongside `ui`; otherwise
  # it refuses to start ("search extension must be enabled").
  config.json: |
    {
      "distSpecVersion": "1.0.1",
      "storage": {
        "rootDirectory": "/var/lib/registry"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "compat": ["docker2s2"]
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "search": {
          "enable": true
        },
        "ui": {
          "enable": true
        }
      }
    }
