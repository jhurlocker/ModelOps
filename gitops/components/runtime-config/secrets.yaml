# WARNING: The scan-s3-credentials and result-s3-credentials Secrets below
# use MinIO's well-known default credentials (minioadmin/minioadmin),
# intentionally committed as plaintext only because this is a disposable
# sandbox cluster using a disposable in-cluster MinIO instance. This is NOT
# a pattern to follow for any non-sandbox deployment. The gitops/README.md
# Customization section references this as the concrete reason for its
# production recommendation (sealed-secret or external secret provider).
# See docs/REFACTOR_PLAN.md's backlog for the tracked item to introduce a
# real secrets-management pattern before this project extends beyond
# sandbox use.
apiVersion: v1
kind: Secret
metadata:
  name: scan-s3-credentials
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: modelops
type: Opaque
data:
  accessKeyId: bWluaW9hZG1pbg==
  # WARNING: endpoint MUST be the internal Kubernetes Service DNS name,
  # NOT an external OpenShift Route URL. TLS is edge-terminated at the
  # Route only (route.yaml spec.tls.termination: edge); the internal
  # Service runs plain HTTP on port 9000. Using an external Route URL
  # caused a real pipeline failure on the sandbox cluster: the Tekton
  # S3-upload step failed with NameResolutionError for the old cluster's
  # route domain (minio-modelops-storage.apps.ocp.wpmzp.sandbox2855.opentlc.com)
  # because that hostname does not exist on new clusters. Internal
  # Service DNS is cluster-portable and avoids any Route dependency.
  # DO NOT change this back to an https:// Route URL.
  endpoint: aHR0cDovL21pbmlvLm1vZGVsb3BzLXN0b3JhZ2Uuc3ZjLmNsdXN0ZXIubG9jYWw6OTAwMA==
  secretAccessKey: bWluaW9hZG1pbg==
---
apiVersion: v1
kind: Secret
metadata:
  name: result-s3-credentials
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: modelops
type: Opaque
data:
  accessKeyId: bWluaW9hZG1pbg==
  # Same constraint as scan-s3-credentials: internal Service DNS only.
  # See the full explanation above.
  endpoint: aHR0cDovL21pbmlvLm1vZGVsb3BzLXN0b3JhZ2Uuc3ZjLmNsdXN0ZXIubG9jYWw6OTAwMA==
  secretAccessKey: bWluaW9hZG1pbg==
---
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-credentials
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: modelops
type: Opaque
data:
  url: aHR0cHM6Ly9kZWZhdWx0LWV2YWxodWIucmVkaGF0LW9kcy1hcHBsaWNhdGlvbnMuc3ZjLmNsdXN0ZXIubG9jYWw6ODQ0Mw==
