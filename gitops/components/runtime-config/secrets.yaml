# The scan/result S3 credentials and the Zot push credential are SealedSecrets
# (see scan-s3-credentials-sealedsecret.yaml, result-s3-credentials-sealedsecret.yaml,
# zot-push-credentials-sealedsecret.yaml) — encrypted per-cluster, never
# committed as plaintext. This file now holds only the EvalHub *endpoint*
# credential, which is a cluster-internal Service URL, not a secret value.
#
# The sealed credentials are generated fresh per cluster with genuinely random
# values via the `kubeseal` bootstrap flow documented in gitops/README.md's
# "Secrets setup" step. The identity groupings (MinIO root user/password shared
# by the scan/result S3 + results-ui + intake-ui credentials; the zotadmin
# password shared by zot-htpasswd + zot-push-credentials) must be rotated
# together — see the same README section.
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-credentials
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: modelops
type: Opaque
data:
