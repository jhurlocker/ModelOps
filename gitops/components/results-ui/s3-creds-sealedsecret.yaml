kind: SealedSecret
metadata:
  name: s3-creds
  namespace: sandbox
spec:
  encryptedData:
    S3_ACCESS_KEY: 
    S3_BUCKET_NAME: 
    S3_ENDPOINT_URL: 
    S3_SECRET_KEY: 
  template:
    metadata:
      name: s3-creds
      namespace: sandbox
      labels:
        app.kubernetes.io/part-of: modelops
    type: Opaque
