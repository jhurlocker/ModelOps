apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modelops-operator-controller
  labels:
    app.kubernetes.io/name: modelops-operator
rules:
  # ModelRequest CRD
  - apiGroups:
      - modelops.example.io
    resources:
      - modelrequests
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - modelops.example.io
    resources:
      - modelrequests/finalizers
    verbs:
      - update
  - apiGroups:
      - modelops.example.io
    resources:
      - modelrequests/status
    verbs:
      - get
      - patch
      - update
  # ModelLifecycleProfile CRD (read-only for resolution)
  - apiGroups:
      - modelops.example.io
    resources:
      - modellifecycleprofiles
    verbs:
      - get
      - list
      - watch
  # PlatformConfig CRD (read-only for resolution)
  - apiGroups:
      - modelops.example.io
    resources:
      - platformconfigs
    verbs:
      - get
      - list
      - watch
  # CapacityPlan CRD
  - apiGroups:
      - modelops.example.io
    resources:
      - capacityplans
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - modelops.example.io
    resources:
      - capacityplans/finalizers
    verbs:
      - update
  - apiGroups:
      - modelops.example.io
    resources:
      - capacityplans/status
    verbs:
      - get
      - patch
      - update
  # Tekton PipelineRuns
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Secrets (read for credential resolution)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
