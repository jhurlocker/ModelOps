apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: capacityplans.modelops.example.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: modelops.example.io
  names:
    kind: CapacityPlan
    listKind: CapacityPlanList
    plural: capacityplans
    singular: capacityplan
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - modelRef
              properties:
                modelRef:
                  type: object
                  required:
                    - modelRequestName
                  properties:
                    modelRequestName:
                      type: string
                gpus:
                  type: integer
                gpuType:
                  type: string
                gpusPerReplica:
                  type: integer
                timeSlicingConfig:
                  type: string
                isolationPolicy:
                  type: string
                contextLength:
                  type: integer
                concurrency:
                  type: integer
                allowTimeSlicing:
                  type: boolean
                allowMIG:
                  type: boolean
                advisorEndpoint:
                  type: string
                advisorSecretName:
                  type: string
                advisorTimeoutSeconds:
                  type: integer
                gpuOperatorNamespace:
                  type: string
                clusterPolicyName:
                  type: string
                timeSlicingConfigMap:
                  type: string
                maxTimeSlices:
                  type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                gpusNeeded:
                  type: integer
                gpuModel:
                  type: string
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: GPUs
          type: integer
          jsonPath: .status.gpusNeeded
