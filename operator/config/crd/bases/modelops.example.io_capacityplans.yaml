  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: capacityplans.modelops.example.io
spec:
  group: modelops.example.io
  names:
    kind: CapacityPlan
    listKind: CapacityPlanList
    plural: capacityplans
    singular: capacityplan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.gpusNeeded
      name: GPUs
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CapacityPlanSpec is the desired state for a capacity-planning run.
              The sizing logic in CapacityPlanReconciler is a static heuristic
              (table-driven ContextLength/Concurrency -> GPU count/model mapping
              with a configurable MaxGPUsPerRequest ceiling), not a real
              GPU-inventory-aware or advisor-backed placement decision. See
              internal/stages/capacityplanning/doc.go and
              internal/controller/capacityplan_controller.go's reconciler doc
              comment for the full honesty label.
            properties:
              advisorEndpoint:
                type: string
              advisorSecretName:
                type: string
              advisorTimeoutSeconds:
                type: integer
              allowMIG:
                type: boolean
              allowTimeSlicing:
                type: boolean
              clusterPolicyName:
                type: string
              concurrency:
                type: integer
              contextLength:
                type: integer
              gpuOperatorNamespace:
                type: string
              gpuType:
                type: string
              gpus:
                type: integer
              gpusPerReplica:
                type: integer
              isolationPolicy:
                type: string
              maxGPUsPerRequest:
                description: |-
                  MaxGPUsPerRequest, when set (> 0), is a configured ceiling
                  CapacityPlanReconciler compares its unclamped GPU recommendation
                  against: if the recommendation would exceed this value,
                  Status.Phase is set to "Failed" instead of silently clamping to
                  the reconciler's own internal 8-GPU cap. Zero/unset preserves the
                  exact pre-Phase-7 clamping behavior (always succeeds, silently
                  capped at 8). Populated from PlatformConfigSpec.MaxGPUsPerRequest
                  by internal/stages/capacityplanning.Handler.BuildSpec, the same
                  way GPUOperatorNamespace/ClusterPolicyName already are. See
                  docs/REFACTOR_PLAN.md Phase 7.
                type: integer
              maxTimeSlices:
                type: integer
              modelRef:
                properties:
                  modelRequestName:
                    type: string
                required:
                - modelRequestName
                type: object
              timeSlicingConfig:
                type: string
              timeSlicingConfigMap:
                type: string
            required:
            - modelRef
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gpuModel:
                type: string
              gpusNeeded:
                type: integer
              message:
                type: string
              phase:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
