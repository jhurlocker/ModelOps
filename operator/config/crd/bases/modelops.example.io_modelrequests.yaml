apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelrequests.modelops.example.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: modelops.example.io
  names:
    kind: ModelRequest
    listKind: ModelRequestList
    plural: modelrequests
    singular: modelrequest
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - modelSource
                - modelURI
              properties:
                modelSource:
                  type: string
                  description: Source of the model (e.g. huggingface, s3, oci)
                modelURI:
                  type: string
                  description: URI of the model (e.g. Qwen/Qwen3.6-27B-FP8)
                targetEnvironment:
                  type: string
                  default: sandbox
                  description: Target environment for the model
                pipelineRef:
                  type: string
                  default: model-intake-pipeline
                  description: Name of the Tekton pipeline to execute
                modelName:
                  type: string
                  description: Kubernetes-safe model name identifier
                modelVersion:
                  type: string
                  default: v1
                  description: Version label for this onboarding run
                requestedBy:
                  type: string
                  description: Who requested this model onboarding
                modelCar:
                  type: object
                  properties:
                    repo:
                      type: string
                      default: redhat-ai-services/modelcar-catalog
                    image:
                      type: string
                namespaces:
                  type: object
                  properties:
                    sandbox:
                      type: string
                      default: vllm
                    staging:
                      type: string
                      default: vllm-staging
                compliance:
                  type: object
                  properties:
                    artifactScanImage:
                      type: string
                    cveThreshold:
                      type: string
                      enum: [none, critical, high]
                    ignoreUnfixed:
                      type: string
                      enum: ["true", "false"]
                    allowedArchitectures:
                      type: array
                      items:
                        type: string
                gpuAdvisor:
                  type: object
                  properties:
                    contextLength:
                      type: integer
                    concurrency:
                      type: integer
                    allowTimeSlicing:
                      type: boolean
                    allowMIG:
                      type: boolean
                    gpuIsolationPolicy:
                      type: string
                      enum: [dedicated, shared]
                    gpuOperatorNamespace:
                      type: string
                    clusterPolicyName:
                      type: string
                    timeSlicingConfigMap:
                      type: string
                    maxTimeSlices:
                      type: integer
                    advisorEndpoint:
                      type: string
                    advisorSecretName:
                      type: string
                    advisorTimeoutSeconds:
                      type: integer
                deploy:
                  type: object
                  properties:
                    releaseName:
                      type: string
                    chartUrl:
                      type: string
                    chartVersion:
                      type: string
                    valuesContent:
                      type: string
                    gpuCountOverride:
                      type: string
                    hardwareProfileName:
                      type: string
                    hardwareProfileNamespace:
                      type: string
                securityScan:
                  type: object
                  properties:
                    severityThreshold:
                      type: string
                    evalhubUrl:
                      type: string
                    evalhubToken:
                      type: string
                    tenantNamespace:
                      type: string
                    openshiftConsoleDomain:
                      type: string
                approval:
                  type: object
                  properties:
                    apiUrl:
                      type: string
                    pollIntervalSeconds:
                      type: integer
                    timeoutSeconds:
                      type: integer
                benchmark:
                  type: object
                  properties:
                    profile:
                      type: string
                    rate:
                      type: number
                    maxSeconds:
                      type: integer
                    maxRequests:
                      type: integer
                    customData:
                      type: boolean
                    customFilename:
                      type: string
                    huggingfaceToken:
                      type: string
                s3Storage:
                  type: object
                  properties:
                    endpoint:
                      type: string
                    accessKeyId:
                      type: string
                    secretAccessKey:
                      type: string
                    bucket:
                      type: string
                    uiRoute:
                      type: string
                scanS3Storage:
                  type: object
                  properties:
                    endpoint:
                      type: string
                    accessKeyId:
                      type: string
                    secretAccessKey:
                      type: string
                    bucket:
                      type: string
                    uiRoute:
                      type: string
                modelRegistry:
                  type: object
                  properties:
                    server:
                      type: string
                    port:
                      type: string
                    author:
                      type: string
                modelAccess:
                  type: object
                  properties:
                    authorizedViewers:
                      type: string
                    accessRole:
                      type: string
                maas:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    servingNamespace:
                      type: string
                    policyNamespace:
                      type: string
                    gpuCount:
                      type: string
                    runtimeImage:
                      type: string
                    authorizedGroup:
                      type: string
                lmEval:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    jobName:
                      type: string
                    useCustom:
                      type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase of the model onboarding
                pipelineRunName:
                  type: string
                  description: Name of the Tekton PipelineRun executing the onboarding
                message:
                  type: string
                  description: Human-readable status message
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PipelineRun
          type: string
          jsonPath: .status.pipelineRunName
        - name: Model
          type: string
          jsonPath: .spec.modelURI
